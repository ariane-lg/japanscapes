<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Japanscapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --paper:#ecece7; --surface:#f8f8f4; --raise:#ffffff;
    --ink:#161a21; --soft:#5a606b; --line:rgba(22,26,33,.13);
    --shu:#25428f; --shu-soft:rgba(37,66,143,.1); --eat:#c8452d;
    --ai:#27405e; --matcha:#5f7a3f; --kin:#a8842c;
    --shadow:0 1px 2px rgba(22,26,33,.08),0 10px 28px rgba(22,26,33,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#101319; --surface:#171b23; --raise:#1e232d;
      --ink:#e9e8e1; --soft:#a3a9b5; --line:rgba(233,232,225,.14);
      --shu:#8fa6ee; --shu-soft:rgba(143,166,238,.16); --eat:#e5714f;
      --ai:#9db4d4; --matcha:#a1b87e; --kin:#d1b061;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101319; --surface:#171b23; --raise:#1e232d;
    --ink:#e9e8e1; --soft:#a3a9b5; --line:rgba(233,232,225,.14);
    --shu:#8fa6ee; --shu-soft:rgba(143,166,238,.16); --eat:#e5714f;
    --ai:#9db4d4; --matcha:#a1b87e; --kin:#d1b061;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.55 'Zen Kaku Gothic New',system-ui,sans-serif;display:flex;flex-direction:column}
  h1,h2,h3,h4{font-family:'Shippori Mincho',serif;text-wrap:balance;margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--ai)}
  :focus-visible{outline:2px solid var(--shu);outline-offset:2px}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1.1rem;border-bottom:1px solid var(--line);background:var(--surface);flex:none;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.7rem}
  .seal{width:34px;height:34px;display:grid;place-items:center;background:var(--shu);color:#fff;font:800 20px/1 'Shippori Mincho',serif;border-radius:3px;transform:rotate(-3deg)}
  .brand b{font:800 1.2rem/1 'Shippori Mincho',serif;letter-spacing:.02em;display:block}
  .brand small{color:var(--soft);font-size:.74rem;letter-spacing:.08em}
  .tabs{display:flex;gap:.2rem;flex-wrap:wrap}
  .tab{background:none;border:none;padding:.5rem .8rem;color:var(--soft);font-weight:700;font-size:.86rem;border-bottom:2px solid transparent;display:flex;align-items:baseline;gap:.4rem}
  .tab i{font:500 .75rem 'Shippori Mincho',serif;font-style:normal;opacity:.7}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}

  /* ---- layout ---- */
  .app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}
  .mapcol{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#e5e7e4}
  .panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;position:relative}
  @media (max-width:900px){
    body{display:block;height:auto}
    .app{display:block}
    .mapcol{height:58vh}
    .panel{border-left:none;border-top:1px solid var(--line);overflow:visible}
  }

  /* ---- map tools ---- */
  .maptools{position:absolute;z-index:500;left:10px;top:10px;right:10px;display:flex;gap:.45rem;flex-wrap:wrap;pointer-events:none}
  .maptools>*{pointer-events:auto}
  .seg,.chip{background:color-mix(in srgb,var(--raise) 94%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px}
  .seg{display:inline-flex;padding:2px}
  .seg button{border:none;background:none;padding:.28rem .75rem;border-radius:999px;font-size:.76rem;font-weight:700;color:var(--soft)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--raise)}
  .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;font-size:.76rem;font-weight:700;color:var(--ink)}
  .chip .sw{width:.62rem;height:.62rem;border-radius:50%;border:2px solid transparent}
  .chip[aria-pressed="false"]{color:var(--soft)}
  .chip[aria-pressed="false"] .sw{background:transparent!important;border-color:var(--soft)}
  .chip.line-chip .sw{border-radius:2px;width:.9rem;height:.25rem;background:linear-gradient(90deg,#FF9500,#F62E36,#00BB85,#8F76D6)}

  /* ---- leaflet skin ---- */
  .leaflet-control-zoom a{background:var(--raise);color:var(--ink);border-color:var(--line)}
  .leaflet-container{font-family:inherit}
  .leaflet-container :focus,.leaflet-container :focus-visible,.leaflet-container path.leaflet-interactive:focus,.leaflet-container .leaflet-interactive:focus{outline:none!important}
  .leaflet-control-attribution{font-size:10px}

  /* map is always light, so its overlays use fixed ink colours */
  path.ward{fill:rgba(255,255,255,.35);stroke:#27405e;stroke-opacity:.55;stroke-width:1;cursor:pointer;transition:fill .15s}
  path.ward.has{fill:rgba(39,64,94,.09)}
  path.ward:hover{fill:rgba(194,58,43,.12)}
  path.ward.sel{fill:rgba(37,66,143,.12);stroke:#25428f;stroke-opacity:1;stroke-width:2.2}
  [data-band="detail"] path.ward,[data-band="street"] path.ward{fill:transparent}
  [data-band="detail"] path.ward.sel,[data-band="street"] path.ward.sel{fill:rgba(194,58,43,.05)}
  path.hood{fill:rgba(39,64,94,.08);stroke:#27405e;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:4 4;cursor:pointer}
  path.hood:hover,path.hood.sel{fill:rgba(37,66,143,.12);stroke:#25428f;stroke-opacity:.9;stroke-dasharray:none}
  .mline{pointer-events:stroke}

  .wlabel span,.hlabel span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#2a2f3a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
  .wlabel span{font:700 10.5px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
  .wlabel.main span{font:800 13px 'Shippori Mincho',serif;letter-spacing:.02em;text-transform:none;color:#161a21}
  .hlabel span{font:800 12px 'Shippori Mincho',serif;color:#161a21}
  [data-band="area"] .wlabel,[data-band="detail"] .wlabel,[data-band="street"] .wlabel{display:none}
  [data-band="overview"] .hoteltip{display:none}
  [data-band="overview"] .wlabel.main span{font-size:11.5px}
  [data-band="overview"] .hlabel,[data-band="overview"] path.hood{display:none}
  [data-band="overview"] .pin,[data-band="area"] .pin{display:none}
  [data-band="overview"] .pintip,[data-band="area"] .pintip,[data-band="detail"] .pintip:not(.on){display:none}

  path.pin{stroke:#fff;stroke-width:1.6;fill-opacity:1;cursor:pointer}
  path.pin-sight{fill:#27405e} path.pin-eat{fill:#c23a2b} path.pin-make{fill:#a8842c} path.pin-green{fill:#5f7a3f}
  path.pin.mine{stroke:#161a21;stroke-width:2.4}
  path.pin.sel{stroke:#161a21;stroke-width:3.4}
  .pintip{background:rgba(255,255,255,.92);border:none;box-shadow:0 1px 4px rgba(0,0,0,.2);color:#161a21;font:700 11px 'Zen Kaku Gothic New',sans-serif;padding:1px 6px;border-radius:3px}
  .pintip::before{display:none}
  .wtip{background:#161a21;color:#fff;border:none;font:700 11px 'Zen Kaku Gothic New',sans-serif;padding:2px 8px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .wtip::before{display:none}
  .wtip{white-space:normal;width:max-content;max-width:270px;line-height:1.4;padding:.5rem .7rem;font:500 12px 'Zen Kaku Gothic New',sans-serif}
  .wtip b{font:800 14px 'Shippori Mincho',serif}
  .wtip .tj{opacity:.7;font:500 12px 'Shippori Mincho',serif;margin-left:.2rem}
  .wtip .tt{font:700 12px 'Shippori Mincho',serif;color:#aebcf2;margin:.15rem 0 .2rem}
  .wtip .tb{opacity:.92}
  .wtip .tf{margin-top:.3rem;opacity:.75;font-size:11px}
  .wtip .tc{margin-top:.35rem;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
  [data-band="detail"] .wtip.wardtip,[data-band="street"] .wtip.wardtip{display:none}
  [data-band="overview"] .wtip.hoodtip{display:none}
  p.para{margin:.35rem 0;max-width:62ch}
  .srcs{font-size:.74rem;line-height:1.5;color:var(--soft);margin:1rem 0 0}
  .srcs a{color:var(--soft)}
  details.theme{border:1px solid var(--line);background:var(--raise);border-radius:4px;padding:.55rem .8rem;margin-bottom:.4rem}
  details.theme summary{cursor:pointer;font:800 .98rem/1.3 'Shippori Mincho',serif}
  details.theme[open] summary{margin-bottom:.2rem}
  .row.wide{grid-template-columns:1fr}

  /* ===== Minimal poster theme: white field, ink strokes, one red accent, brush kanji ===== */
  .stripe{flex:none;height:0;border-bottom:1px solid var(--ink);opacity:.75}
  .seal{filter:url(#rough);border-radius:2px}
  .brand b{font:italic 800 1.25rem/1 'Shippori Mincho',serif}
  .brand small{letter-spacing:.24em}
  .top{padding:.7rem 1.4rem}
  .tabs{gap:.2rem}
  .tab{border-radius:0;padding:.55rem .7rem;border-bottom:1.5px solid transparent}
  .tab[aria-selected="true"]{border-bottom-color:var(--shu);color:var(--ink)}
  .pwrap{padding:2.1rem 2.3rem 4rem}
  .crumbs{margin-bottom:1.8rem;padding-right:0}
  .hero{margin:.2rem 0 1.5rem}
  .brush{font:400 5.2rem/1.05 'Yuji Boku','Shippori Mincho',serif;color:var(--ink);letter-spacing:.02em;margin:.1rem 0 .7rem;overflow-wrap:anywhere}
  .hero .rule{height:0;border-top:1px solid var(--ink);opacity:.5}
  .hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-top:.8rem}
  .rom{font:italic 600 1.8rem/1.1 'Shippori Mincho',serif}
  .hsub{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:.35rem}
  .hanko{flex:none;width:58px;height:58px;display:grid;place-items:center;border:2.5px solid var(--shu);color:var(--shu);border-radius:3px;transform:rotate(-4deg);filter:url(#rough)}
  .hanko span{writing-mode:vertical-rl;font-family:'Yuji Boku','Shippori Mincho',serif;line-height:1}
  .ptag{color:var(--shu);font-style:italic;margin:.5rem 0 1rem;padding-right:0}
  .lead{margin-bottom:1.6rem}
  h4{border-top:none;padding-top:0;margin:2.2rem 0 .8rem;display:flex;align-items:center;gap:.55rem}
  h4::after{content:"";flex:1;height:0;border-top:1px solid var(--line)}
  ul.dots li::before{background:transparent!important;border:1.2px solid var(--shu);width:6px;height:6px;border-radius:50%;transform:none;top:.55em}
  .yours{background:none;border:1px solid var(--shu);border-radius:2px;padding:.8rem 1rem}
  /* hairline lists instead of boxed cards */
  .row{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:.8rem .1rem}
  .row:hover{border-bottom-color:var(--ink)}
  .row:hover .nm{color:var(--shu)}
  .list{gap:0}
  details.theme{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:.7rem .1rem;margin:0}
  /* custom line icons */
  .ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
  .row .ico{align-self:center;width:1.35em;height:1.35em}
  .c-sight{color:var(--ai)} .c-eat{color:var(--eat)} .c-make{color:var(--kin)} .c-green{color:var(--matcha)} .c-mine,.c-line,.c-history,.c-craft,.c-tips{color:var(--ink)}
  h4 .ico{color:var(--shu)}
  .chip{gap:.45rem}
  .chip[aria-pressed="false"] .ico{opacity:.4}
  .legend{gap:1.1rem}
  .legend span{gap:.4rem}
  /* map wards: ink strokes, red on hover/selected */
  path.ward{fill:rgba(255,255,255,.3);stroke:#14161a;stroke-opacity:.5;stroke-width:1}
  path.ward.has{fill:rgba(20,22,26,.045)}
  path.ward:hover{fill:rgba(37,66,143,.1)}
  path.ward.sel{fill:rgba(37,66,143,.12);stroke:#25428f;stroke-opacity:1;stroke-width:2.2}
  [data-band="detail"] path.ward.has,[data-band="street"] path.ward.has{fill:transparent}
  [data-band="detail"] path.ward.sel,[data-band="street"] path.ward.sel{fill:rgba(37,66,143,.04)}
  /* icon pins on the map */
  .pinb{width:28px;height:28px;border-radius:50%;background:#fff;border:1.7px solid currentColor;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
  .pinb:hover{transform:scale(1.12)}
  .pinb .ico{width:17px;height:17px;vertical-align:0}
  .pinb.pin-sight{color:#25428f} .pinb.pin-eat{color:#c8452d} .pinb.pin-make{color:#a8842c} .pinb.pin-green{color:#5f7a3f}
  .pinb.mine{box-shadow:0 0 0 2px #fff,0 0 0 3.2px #14161a}
  .pinb.sel{background:currentColor;transform:scale(1.18)}
  .pinb.sel .ico{color:#fff}
  .pinb.hotelb{width:26px;height:26px;background:#14161a;color:#14161a;border-color:#fff}
  .pinb.hotelb .ico{color:#fff;width:16px;height:16px}
  /* subtler marks: thin-stroked circles instead of filled squares */
  .seal{width:36px;height:36px;background:transparent;color:var(--shu);border:1.3px solid var(--shu);border-radius:50%;filter:none;transform:none;font:400 19px/1 'Yuji Boku','Shippori Mincho',serif}
  .hanko{width:50px;height:50px;border:1.3px solid var(--shu);border-radius:50%;opacity:.85;filter:none;transform:rotate(-4deg)}
  .pinb.hotelb{width:32px;height:32px;background:#fff;color:#14161a;border:1.4px solid #14161a;box-shadow:0 0 0 5px rgba(37,66,143,.14)}
  .pinb.hotelb .ico{color:#14161a;width:21px;height:21px}
  .leaflet-tooltip.hoteltip{background:rgba(255,255,255,.95);color:#14161a;box-shadow:0 1px 4px rgba(0,0,0,.2);font:italic 600 12px 'Shippori Mincho',serif;padding:1px 8px}
  .row.wide .sub{grid-column:1}
  .hotel{width:22px;height:22px;background:#161a21;color:#fff;border:2px solid #fff;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 1px 5px rgba(0,0,0,.4)}
  .hoteltip{background:#161a21;color:#fff;border:none;font:700 11px 'Zen Kaku Gothic New',sans-serif;padding:2px 8px;border-radius:3px}
  .hoteltip::before{display:none}

  /* ---- panel ---- */
  .pwrap{padding:1.3rem 1.4rem 2.5rem;min-height:100%}
  .crumbs{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--soft);margin-bottom:.9rem;padding-right:3.4rem}
  .crumbs button{border:none;background:none;padding:0;color:var(--ai);font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
  .eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:0 0 .3rem}
  .ptitle{font-weight:800;font-size:1.75rem;line-height:1.15;padding-right:3.4rem}
  .ptag{font:700 1.02rem/1.4 'Shippori Mincho',serif;color:var(--shu);margin:.35rem 0 .7rem;padding-right:3.4rem}
  .kanji{position:absolute;top:1.2rem;right:1.2rem;writing-mode:vertical-rl;font:800 1.5rem/1.1 'Shippori Mincho',serif;color:var(--ink);opacity:.82;border-left:1px solid var(--line);padding-left:.55rem;letter-spacing:.1em}
  .lead{max-width:62ch;margin:0 0 1rem}
  .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
  .tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .65rem;color:var(--soft)}
  h4{font:700 .72rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:1.2rem 0 .45rem;padding-top:.8rem;border-top:1px solid var(--line)}
  ul.dots{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
  ul.dots li{position:relative;padding-left:1rem}
  ul.dots li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--shu);transform:rotate(45deg)}
  .yours{background:var(--shu-soft);border-radius:4px;padding:.7rem .9rem;margin-top:1rem}
  .yours h4{border:none;margin:0 0 .3rem;padding:0;color:var(--shu)}
  dl.facts{margin:1rem 0 0;display:grid;gap:.6rem}
  dl.facts dt{font:700 .7rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  dl.facts dd{margin:.1rem 0 0}
  .lb{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:11px;border:3px solid var(--c);background:var(--raise);font:700 10px/1 'Zen Kaku Gothic New',sans-serif;margin-right:.2rem;vertical-align:middle}
  .btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--ink);background:var(--ink);color:var(--raise);padding:.5rem .95rem;border-radius:3px;font-weight:700;font-size:.82rem;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
  .list{display:grid;gap:.4rem;margin:0;padding:0;list-style:none}
  .row{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:baseline;border:1px solid var(--line);background:var(--raise);border-radius:4px;padding:.55rem .75rem}
  .row:hover{border-color:var(--ink)}
  .row .nm{font:800 1rem/1.25 'Shippori Mincho',serif}
  .row .sub{grid-column:2;color:var(--soft);font-size:.8rem;line-height:1.4}
  .dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block;align-self:center}
  .d-sight{background:var(--ai)} .d-eat{background:var(--shu)} .d-make{background:var(--kin)} .d-green{background:var(--matcha)}
  .cnt{margin-left:.3rem;color:var(--soft);font-weight:400;font-size:.75rem}
  .legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.76rem;color:var(--soft);margin:.2rem 0 0}
  .legend span{display:inline-flex;align-items:center;gap:.35rem}
  .ring{width:.72rem;height:.72rem;border-radius:50%;border:2.5px solid var(--ink);background:var(--soft)}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;border-radius:3px;padding:.1rem .5rem;margin:.15rem .3rem 0 0}
  .badge.mine{background:var(--ink);color:var(--raise)} .badge.guide{background:var(--line);color:var(--soft)}

  /* =====================================================================
     COMPOSITION
     One white sheet. A narrow vertical rail (brand, cities in vertical type),
     the map as a framed plate with an offset registration frame, and the text
     panel as a second sheet laid across the plate's right edge. Everything
     hangs from two axes: the rail line and the 40px text axis inside the sheet.
     ===================================================================== */
  :root{
    --paper:#fdfdfb; --surface:#ffffff; --raise:#ffffff;
    --ink:#1e2527; --soft:#667073; --line:rgba(30,37,39,.12);
    --shu:#3f93c2; --shu-soft:rgba(63,147,194,.08); --eat:#d2566e;
    --ai:#3f7a99; --matcha:#5b9a78; --kin:#b8863f;
    --rose:#f4cdd5; --mint:#cfe6da; --aqua:#c4e1e8; --peach:#f7d9c4;
    --u:8px; --ax:40px; --ease:cubic-bezier(.22,.7,.2,1);
    --shadow:0 1px 2px rgba(30,37,39,.06),0 18px 48px rgba(30,37,39,.12);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0e1314; --surface:#151b1c; --raise:#1a2224;
      --ink:#e8ebe6; --soft:#9aa6a6; --line:rgba(232,235,230,.14);
      --shu:#8cc8e8; --shu-soft:rgba(140,200,232,.12); --eat:#ee8aa0;
      --ai:#86b9d3; --matcha:#98c8ae; --kin:#d6ad6c;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1314; --surface:#151b1c; --raise:#1a2224;
    --ink:#e8ebe6; --soft:#9aa6a6; --line:rgba(232,235,230,.14);
    --shu:#8cc8e8; --shu-soft:rgba(140,200,232,.12); --eat:#ee8aa0;
    --ai:#86b9d3; --matcha:#98c8ae; --kin:#d6ad6c;
  }
  body{display:block;height:100vh;overflow:hidden;background:var(--paper);font-size:14.5px;line-height:1.7}
  .stripe{display:none}
  .page{height:100vh;display:grid;grid-template-columns:88px minmax(0,1fr) 468px;position:relative}

  /* --- rail --- */
  .rail{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--u)*4) 0 calc(var(--u)*3);position:relative;z-index:2}
  .rail::after{content:"";position:absolute;right:0;top:calc(var(--u)*4);bottom:calc(var(--u)*3);width:1px;background:var(--line)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.5)}
  .seal{width:36px;height:36px;font:500 18px/1 'Shippori Mincho',serif;color:var(--shu);border:none;border-radius:0;background:transparent;filter:none;transform:none;display:grid;place-items:center}
  .brand>div{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.5)}
  .brand b{writing-mode:vertical-rl;font:italic 500 1.05rem/1 'Shippori Mincho',serif;letter-spacing:.14em}
  .brand small{writing-mode:vertical-rl;font:400 .56rem/1 'Zen Kaku Gothic New',sans-serif;letter-spacing:.34em;color:var(--soft);text-transform:uppercase;max-height:96px;overflow:hidden;white-space:nowrap}
  .tabs{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.75);counter-reset:tab}
  .tab{counter-increment:tab;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;color:var(--soft);position:relative;font-weight:400}
  .tab::before{content:counter(tab,decimal-leading-zero);font:italic 400 .66rem 'Shippori Mincho',serif;color:var(--shu);order:0}
  .tab i{order:1;writing-mode:vertical-rl;font:400 1.2rem/1.1 'Shippori Mincho',serif;font-style:normal;letter-spacing:.14em;opacity:1;color:var(--soft);transition:color .4s var(--ease)}
  .tab span{order:2;writing-mode:vertical-rl;font:italic 400 .64rem 'Shippori Mincho',serif;letter-spacing:.2em;opacity:.0;max-height:0;transition:opacity .4s var(--ease),max-height .5s var(--ease)}
  .tab:hover i{color:var(--ink)}
  .tab[aria-selected="true"] i{color:var(--shu)}
  .tab[aria-selected="true"] span{opacity:.9;max-height:90px}
  .tab::after{content:"";position:absolute;right:-24px;top:0;bottom:0;width:2px;background:var(--shu);transform:scaleY(0);transform-origin:top;transition:transform .5s var(--ease)}
  .tab[aria-selected="true"]::after{transform:scaleY(1)}
  .tab[aria-selected="true"]{border:none}

  /* --- stage: the map plate --- */
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:calc(var(--u)*4) 0 calc(var(--u)*2) calc(var(--u)*3);position:relative;z-index:1}
  .plate{position:relative;flex:1;min-height:0;margin:0 0 0 0}
  .plate::before{content:"";position:absolute;inset:calc(var(--u)*1.25) calc(var(--u)*-1.25) calc(var(--u)*-1.25) calc(var(--u)*1.25);border:1px solid var(--shu);opacity:.32;pointer-events:none}
  #map{position:absolute;inset:0;background:#e9ece7;border:1px solid rgba(30,37,39,.55);z-index:1}
  .figline{display:flex;align-items:baseline;gap:calc(var(--u)*1.5);padding:calc(var(--u)*3) 0 calc(var(--u)*1.25);font:italic 400 .82rem 'Shippori Mincho',serif;color:var(--soft)}
  .figline b{font:400 .6rem 'Zen Kaku Gothic New',sans-serif;font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--shu)}
  .figline::after{content:"";flex:1;height:1px;background:var(--line);align-self:center;max-width:260px}
  .maptools{position:static;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.75);padding:0 calc(var(--u)*13) 0 0;z-index:auto}
  .maptools>*{pointer-events:auto}
  /* controls read as the map's key: a hairline, then coloured discs with italic captions */
  .maptools{gap:calc(var(--u)*1) calc(var(--u)*3);align-items:center;border-top:1px solid var(--line);padding:calc(var(--u)*1.5) calc(var(--u)*13) 0 0}
  .seg,.chip{background:none;border:none;box-shadow:none;border-radius:0;backdrop-filter:none;padding:0}
  .seg{display:inline-flex;gap:calc(var(--u)*1.5);margin-right:calc(var(--u)*1)}
  .seg button,.chip{font:italic 500 .86rem/1 'Shippori Mincho',serif;letter-spacing:.01em;text-transform:none;color:var(--soft);background:none;border:none;border-radius:0;padding:.3rem 0;transition:color .3s var(--ease)}
  .seg button+button::before{content:"/";margin-right:calc(var(--u)*1.5);color:var(--line);font-style:normal}
  .seg button{border-bottom:1px solid transparent}
  .seg button:hover,.chip:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{color:var(--shu);background:none}
  .chip{display:inline-flex;align-items:center;gap:.55rem}
  .chip[aria-pressed="true"]{color:var(--ink);background:none;border:none}
  .dsc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 30%,#fff);mix-blend-mode:multiply;transition:background .4s var(--ease),transform .4s var(--ease),box-shadow .3s}
  .dsc .ico{width:15px;height:15px;vertical-align:0}
  .chip:hover .dsc{transform:scale(1.1)}
  .chip[aria-pressed="false"] .dsc{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .chip[aria-pressed="false"] .ico{opacity:.35}
  .chip.line-chip .sw{display:none}
  .leaflet-right .leaflet-control{margin-right:calc(var(--u)*13)}
  .leaflet-control-zoom{border:none!important;box-shadow:none!important}
  .leaflet-control-zoom a{border:1px solid var(--line)!important;border-radius:0!important;background:var(--raise);margin-bottom:-1px}

  /* --- map style --- */
  .leaflet-tile-pane{opacity:.5;filter:grayscale(1) contrast(.9)}
  #map{background:#fff}
  [data-band="detail"] .leaflet-tile-pane,[data-band="street"] .leaflet-tile-pane{opacity:.9;filter:grayscale(.3)}
  .leaflet-tile-pane{transition:opacity .6s}
  /* wards as pen line-drawing: ink outline, paper fill, no colour */
  path.ward{fill:#fbfaf6;fill-opacity:.5;stroke:#1e2527;stroke-opacity:.72;stroke-width:1.05;stroke-linejoin:round;filter:url(#rough);transition:fill-opacity .35s var(--ease),stroke-opacity .3s,stroke-width .3s}
  path.ward.has{fill:#fbfaf6;fill-opacity:.72}
  path.ward:not(.has){fill:#fbfaf6;stroke-opacity:.4}
  path.ward:hover{fill:#fff}
  path.ward:hover{fill-opacity:.85;stroke-opacity:1;stroke-width:1.6}
  path.ward.sel{fill-opacity:.9;stroke:#1e2527;stroke-opacity:1;stroke-width:2}
  [data-band="detail"] path.ward,[data-band="street"] path.ward{fill-opacity:0;stroke-opacity:.45;stroke-width:1}
  [data-band="detail"] path.ward.sel,[data-band="street"] path.ward.sel{fill-opacity:0;stroke-opacity:.9;stroke-width:1.8}
  /* neighbourhood discs echo the sheet's overlapping circles: same palette, blended where they meet */
  path.hood{stroke:none;fill-opacity:.62;mix-blend-mode:multiply;stroke-dasharray:none;transition:fill-opacity .4s var(--ease)}
  path.hood.c0{fill:#bfe3d3} path.hood.c1{fill:#f3c9d2} path.hood.c2{fill:#bfe0e6} path.hood.c3{fill:#d9d2ef} path.hood.c4{fill:#f6d5c0}
  path.hood:hover{fill-opacity:.85}
  path.hood.sel{fill-opacity:.8;stroke:#1e2527;stroke-opacity:.8;stroke-width:1}
  .wlabel.main span,.hlabel span{font:500 12px 'Shippori Mincho',serif;color:#1e2527;text-shadow:0 0 4px rgba(255,255,255,.9),0 0 2px #fff}
  .wlabel span{font:400 9.5px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.2em;color:#55625f}
  .pinb{border-width:1.3px;box-shadow:0 0 0 4px rgba(255,255,255,.6),0 2px 6px rgba(30,37,39,.18);animation:fadein .7s var(--ease) both}
  .pinb.pin-sight{color:#3f7a99} .pinb.pin-eat{color:#d2566e} .pinb.pin-make{color:#b8863f} .pinb.pin-green{color:#5b9a78}
  .pinb.hotelb{color:#1e2527;box-shadow:0 0 0 7px rgba(63,147,194,.2)}
  .wtip{background:rgba(255,255,255,.98);color:var(--ink);border:none;border-radius:0;box-shadow:0 14px 36px rgba(30,37,39,.16)}
  .wtip .tt{color:#3f93c2;font-style:italic;font-weight:500}
  .wtip .tj,.wtip .tf,.wtip .tc{color:#667073;opacity:1}
  .wtip .tb{opacity:1}
  .pintip{border-radius:0;font-weight:500}
  .leaflet-tooltip.hoteltip{border-radius:0}

  /* --- the sheet (panel) laid across the plate's edge --- */
  .panel{position:relative;z-index:5;margin:calc(var(--u)*8) calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*-12);background:var(--raise);border:none;box-shadow:var(--shadow);overflow-y:auto;overflow-x:hidden}
  .panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:var(--line)}
  .pwrap{padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*9) calc(var(--u)*4);counter-reset:sec;min-height:100%}
  .crumbs{margin:0 0 calc(var(--u)*3);font:400 .62rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:0;color:var(--soft)}
  .crumbs button{text-decoration:none;color:var(--shu);transition:opacity .2s}
  .crumbs button:hover{opacity:.55}

  /* hero: type and two overlapping discs, no boxes */
  .hero{position:relative;display:grid;grid-template-columns:1fr auto;column-gap:calc(var(--u)*2);min-height:236px;margin:0 0 calc(var(--u)*4)}
  .sun{position:absolute;border:none;padding:0;border-radius:50%;mix-blend-mode:multiply;opacity:.78;cursor:pointer;display:grid;place-items:center;animation:pop 1.2s var(--ease) both;transition:opacity .3s,transform .5s var(--ease)}
  .sun.s1{animation-delay:.2s}.sun.s2{animation-delay:.35s}
  .sun:hover{opacity:1;transform:scale(1.05)}
  .hero.still .sun,.hero.still .brush{animation:none}
  .hero.pick .sun{opacity:.38}
  .hero.pick .sun.on{opacity:.95;transform:scale(1.03)}
  .sun span{font:italic 500 .68rem 'Shippori Mincho',serif;color:var(--ink);opacity:.75;max-width:72%;text-align:center;line-height:1.2;pointer-events:none}
  .sun.s2 span{font-size:.6rem}
  path.hood.glow{fill-opacity:.95;stroke:#1e2527;stroke-opacity:.7;stroke-width:1.2}
  .ttl{grid-column:2;grid-row:1;position:relative;z-index:1;justify-self:end;padding-right:calc(var(--u)*1)}
  .brush{writing-mode:vertical-rl;font:400 56px/1.2 'Shippori Mincho',serif;letter-spacing:.2em;color:var(--ink);margin:0;max-height:236px;animation:inkin 1.2s .25s var(--ease) both}
  .cap{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1;padding-bottom:2px}
  .cap .sub{font:400 .6rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);padding-top:calc(var(--u)*.5);display:flex;align-items:center;gap:calc(var(--u)*1.25)}
  .cap .sub::before{content:"";width:32px;height:1px;background:var(--ink);transform-origin:left;animation:draw 1s .5s var(--ease) both}
  .rom{font:italic 500 2.7rem/1.05 'Shippori Mincho',serif;letter-spacing:-.01em;padding:0}

  /* everything below the hero hangs from the 40px text axis */
  .pwrap>*:not(.hero):not(.crumbs):not(h4):not(.actions):not(.srcs){margin-left:var(--ax)}
  .pwrap>.actions,.pwrap>.srcs{margin-left:var(--ax)}
  .ptag{font:italic 500 1.2rem/1.45 'Shippori Mincho',serif;color:var(--shu);margin-top:0;margin-bottom:calc(var(--u)*2);max-width:30ch;padding:0}
  .lead{font:400 .98rem/2 'Shippori Mincho',serif;max-width:50ch;margin-bottom:calc(var(--u)*3)}
  .tags{gap:.1rem;margin-bottom:calc(var(--u)*2)}
  .tag{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:0 .1rem;margin-right:.8rem;font:400 .62rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.2em;text-transform:uppercase}
  .eyebrow{letter-spacing:.26em;font-weight:500;color:var(--shu)}
  .ptitle{font:500 2.1rem/1.15 'Shippori Mincho',serif;padding:0}

  h4{counter-increment:sec;display:flex;align-items:baseline;gap:0;margin:calc(var(--u)*6) 0 calc(var(--u)*2);padding:0;border:none;font:500 .66rem 'Zen Kaku Gothic New',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
  h4::before{content:counter(sec,decimal-leading-zero);font:italic 400 1.2rem/1 'Shippori Mincho',serif;letter-spacing:0;color:var(--shu);text-transform:none;width:var(--ax);flex:none}
  h4::after{content:"";flex:1;height:1px;background:var(--line);transform-origin:left;align-self:center;margin-left:calc(var(--u)*2);animation:draw 1s var(--ease) both}
  h4 .ico{order:2;margin:0 .55rem 0 0;width:1em;height:1em;color:var(--shu)}
  .yours{margin-left:var(--ax);background:var(--shu-soft);border:none;border-left:2px solid var(--shu);border-radius:0;padding:calc(var(--u)*2) calc(var(--u)*2.5)}
  .yours h4{margin:0 0 .5rem}.yours h4::before,.yours h4::after{display:none}
  .para{line-height:1.95;max-width:52ch;margin:.6rem 0}
  ul.dots{gap:.7rem}
  ul.dots li::before{border-color:var(--shu);top:.72em}
  dl.facts dt{letter-spacing:.24em;font-weight:500;color:var(--shu)}
  .row{padding:calc(var(--u)*1.75) .1rem;border:none;border-radius:0;background:transparent;border-bottom:1px solid var(--line);transition:transform .45s var(--ease),border-color .3s,background .3s}
  .row:hover{transform:translateX(6px);border-bottom-color:var(--shu);background:linear-gradient(90deg,var(--shu-soft),transparent 70%)}
  .row .nm{font:600 1.02rem/1.3 'Shippori Mincho',serif}
  .row .sub{font-size:.8rem;line-height:1.6}
  .cnt{font-family:'Shippori Mincho',serif;font-style:italic}
  details.theme{padding:calc(var(--u)*1.75) .1rem}
  details.theme summary{font:600 1rem/1.4 'Shippori Mincho',serif;list-style:none;display:flex;gap:.6rem;justify-content:space-between;align-items:baseline;transition:color .3s}
  details.theme summary::-webkit-details-marker{display:none}
  details.theme summary::after{content:"+";font:300 1.3rem/1 'Shippori Mincho',serif;color:var(--shu);transition:transform .4s var(--ease)}
  details.theme[open] summary::after{transform:rotate(45deg)}
  details.theme:hover summary{color:var(--shu)}
  details.theme[open] .para,details.theme[open] .srcs{animation:rise .6s var(--ease) both}
  .btn{border-radius:0;background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500;letter-spacing:.06em;padding:.65rem 1.2rem;transition:transform .35s var(--ease),box-shadow .35s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(63,147,194,.25)}
  .btn.ghost{background:transparent;color:var(--shu);border-color:var(--shu)}
  .legend{margin-top:calc(var(--u)*2);font-size:.7rem;letter-spacing:.1em}
  .srcs{line-height:1.7;margin-top:calc(var(--u)*3)}

  /* --- motion --- */
  .pwrap>*{animation:rise .9s var(--ease) both}
  .pwrap>*:nth-child(1){animation-delay:.04s}.pwrap>*:nth-child(2){animation-delay:.1s}.pwrap>*:nth-child(3){animation-delay:.16s}
  .pwrap>*:nth-child(4){animation-delay:.22s}.pwrap>*:nth-child(5){animation-delay:.28s}.pwrap>*:nth-child(6){animation-delay:.34s}
  .pwrap>*:nth-child(n+7){animation-delay:.4s}
  .pwrap>.hero{animation:none}
  ul.list>li,ul.dots>li{animation:rise .8s var(--ease) both}
  ul.list>li:nth-child(1),ul.dots>li:nth-child(1){animation-delay:.25s}
  ul.list>li:nth-child(2),ul.dots>li:nth-child(2){animation-delay:.31s}
  ul.list>li:nth-child(3),ul.dots>li:nth-child(3){animation-delay:.37s}
  ul.list>li:nth-child(4),ul.dots>li:nth-child(4){animation-delay:.43s}
  ul.list>li:nth-child(5),ul.dots>li:nth-child(5){animation-delay:.49s}
  ul.list>li:nth-child(n+6),ul.dots>li:nth-child(n+6){animation-delay:.55s}
  .panel,.plate::before{animation:fadein .8s var(--ease) both}
  /* --- thin pass: hairlines everywhere on the map --- */
  #map{border:1px solid rgba(30,37,39,.3)}
  .plate::before{opacity:.22}
  path.ward{stroke-width:.7;stroke-opacity:.62}
  path.ward:not(.has){stroke-opacity:.34}
  path.ward:hover{stroke-width:1.1}
  path.ward.sel{stroke-width:1.5}
  [data-band="detail"] path.ward,[data-band="street"] path.ward{stroke-width:.6}
  [data-band="detail"] path.ward.sel,[data-band="street"] path.ward.sel{stroke-width:1.2}
  path.hood.sel,path.hood.glow{stroke:none}
  path.hood.sel{fill-opacity:.95}
  path.hood.glow{fill-opacity:.9}
  path.hood:hover{stroke:none}
  .wlabel span{font-weight:300;letter-spacing:.22em}
  .wlabel.main span,.hlabel span{font-weight:400}
  .pinb{border-width:1px;width:26px;height:26px}
  .pinb .ico{width:15px;height:15px;stroke-width:1.1}
  .pinb.hotelb{border-width:1px}
  /* zoom: two hairline circles, no block */
  .leaflet-bar{border:none!important;box-shadow:none!important;background:none!important}
  .leaflet-control-zoom a{width:30px!important;height:30px!important;line-height:28px!important;border:1px solid rgba(30,37,39,.3)!important;border-radius:50%!important;background:rgba(255,255,255,.92)!important;color:var(--ink);font:200 18px/28px 'Shippori Mincho',serif!important;margin:0 0 8px!important;box-shadow:none;transition:border-color .3s,background .3s,transform .3s var(--ease)}
  .leaflet-control-zoom a:hover{border-color:var(--shu)!important;color:var(--shu);transform:scale(1.06)}
  .leaflet-control-attribution{background:transparent!important;font-size:9px;opacity:.55}
  /* key: active choice gets a hairline underline */
  .seg button[aria-pressed="true"]{border-bottom:1px solid var(--shu)}
  .maptools{gap:calc(var(--u)*1.25) calc(var(--u)*3.5);padding-top:calc(var(--u)*2.5)}
  .dsc{width:24px;height:24px}
  .chip[aria-pressed="true"] .dsc{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,#fff)}
  /* three map buttons as one hairline capsule: zoom in, zoom out, back to main view */
  .leaflet-control-zoom.leaflet-bar{border:1px solid rgba(30,37,39,.3)!important;border-radius:999px!important;background:rgba(255,255,255,.94)!important;overflow:hidden;box-shadow:none!important}
  .leaflet-control-zoom a{border:none!important;border-radius:0!important;margin:0!important;background:transparent!important;width:34px!important;height:34px!important;line-height:32px!important;display:grid;place-items:center;transform:none!important}
  .leaflet-control-zoom a+a{border-top:1px solid rgba(30,37,39,.14)!important}
  .leaflet-control-zoom a:hover{background:rgba(63,147,194,.08)!important;color:var(--shu)}
  .leaflet-control-zoom .zhome svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  /* the trail: a fine pen line over a soft wash, like the hand-drawn route maps */
  path.trail{fill:none}
  /* labels that sit beside their circle instead of on top of it */
  .hlabel.ha-r span{transform:translate(34px,-50%);text-align:left}
  .hlabel.ha-l span{transform:translate(calc(-100% - 34px),-50%);text-align:right}
  .hlabel span em{display:block;font:italic 400 .64rem 'Shippori Mincho',serif;letter-spacing:.06em;color:var(--soft);text-shadow:inherit;margin-top:1px}
  /* rail: no lines, the selected city is simply fuller */
  .rail::after{display:none}
  .tab::after{display:none}
  .tab{opacity:.42;transition:opacity .4s var(--ease)}
  .tab:hover{opacity:.8}
  .tab[aria-selected="true"]{opacity:1}
  .tab i,.tab[aria-selected="true"] i{color:var(--ink)}
  .tab[aria-selected="true"] i{color:var(--shu)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{from{opacity:0;transform:scale(.5)}to{transform:none}}
  @keyframes inkin{from{opacity:0;filter:blur(6px);letter-spacing:.5em}to{opacity:1;filter:none}}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sun{mix-blend-mode:screen;opacity:.35}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* --- narrow screens: rail becomes a top strip, sheet slides under the plate --- */
  @media (max-width:900px){
    body{height:auto;overflow:visible}
    .page{display:block;height:auto}
    .rail{flex-direction:row;padding:calc(var(--u)*2) calc(var(--u)*2.5);align-items:center;gap:calc(var(--u)*2)}
    .rail::after{display:none}
    .brand{flex-direction:row}.brand>div{flex-direction:row}
    .brand b,.brand small{writing-mode:horizontal-tb}.brand small{display:none}
    .rail{flex-wrap:wrap}.tabs{flex:1 1 100%;flex-direction:row!important;gap:calc(var(--u)*2.5);overflow-x:auto;align-items:baseline}
    .tab{flex-direction:row;align-items:baseline;gap:6px;white-space:nowrap}
    .tab i,.tab span{writing-mode:horizontal-tb;font-size:.9rem}
    .tab span{opacity:1;max-height:none;font-size:.75rem}
    .tab::after{display:none}
    .stage{padding:0 calc(var(--u)*2.5)}
    .plate{height:56vh;flex:none}
    .plate::before{display:none}
    .maptools{padding-right:0}
    .leaflet-right .leaflet-control{margin-right:10px}
    .panel{margin:calc(var(--u)*-4) calc(var(--u)*1.5) calc(var(--u)*3);overflow:visible}
    .pwrap{padding:calc(var(--u)*3) calc(var(--u)*2.5) calc(var(--u)*6)}
    :root{--ax:28px}
  }
</style>

 {id:"akasaka",name:"Akasaka",short:"Akasaka",jp:"赤坂",g:"high",lat:35.6745,lng:139.7365,llat:35.6714,llng:139.7372,r:.55,p:1,tags:["food","temples","history"],
  tag:"power lunches by day, lantern-lit alleys by night",
  intro:"Politicians and executives fill Akasaka by day. After dark, the lanes off Hitotsugi-dori light up with izakaya, Korean restaurants and bars a few seats wide. This was once one of Tokyo’s great geisha quarters, with around 400 geisha at its peak; about 20 still work here.",

  l:[],t:"You’re here",go:"Akasaka station (Chiyoda) 3 min · Akasaka-mitsuke (Ginza, Marunouchi) 5 min · Nagatacho (Hanzomon, Namboku) through the underground link · Tameike-sanno (Ginza, Namboku) 8 min",when:"Shrines from 6am; the alleys after 6pm"},
 {id:"roppongi",name:"Roppongi",short:"Roppongi",jp:"六本木",g:"high",lat:35.6625,lng:139.7310,r:.6,p:2,tags:["art","night"],
  tag:"Art by day, all-nighters after dark",
  intro:"Roppongi’s name still means late bars and clubs, but in daylight it’s one of Tokyo’s strongest culture districts. The Art Triangle of the Mori Art Museum, the National Art Center and the Suntory Museum of Art sits within a short walk, with Tadao Ando’s 21_21 Design Sight in between.",
  see:["Mori Art Museum and the Tokyo City View deck near the top of Mori Tower","The National Art Center’s rippling glass façade by Kisho Kurokawa","21_21 Design Sight, Ando’s building for Issey Miyake, in Tokyo Midtown","teamLab Borderless at nearby Azabudai Hills"],
  eat:["The food floors of Tokyo Midtown and Roppongi Hills for an easy lunch"],
  l:["N"],t:"15–20 min walk",go:"A 15–20 minute walk south, or the Namboku line from Tameike-sanno to Roppongi-itchome (1 stop)",when:"Daytime and early evening; the main crossing gets rowdy late"},
 {id:"aoyama",name:"Aoyama & Omotesando",short:"Aoyama",jp:"青山・表参道",g:"high",lat:35.6655,lng:139.7135,r:.7,p:2,tags:["art","shop","leaves"],
  tag:"Tokyo’s architecture catwalk",
  intro:"Omotesando’s zelkova-lined avenue doubles as an open-air architecture show, with buildings by Tadao Ando, Toyo Ito and Herzog & de Meuron. One block off it, Aoyama turns quiet: galleries, design shops and the Nezu Museum’s hillside garden.",
  see:["Nezu Museum: a Kengo Kuma building and a garden at its best in autumn (book a timed ticket)","Jingu Gaien’s ginkgo avenue, usually golden from mid-November","Omotesando Hills and Prada Aoyama, for the architecture alone"],
  eat:["Coffee and patisserie in the backstreets on either side of the avenue"],

 {id:"harajuku",name:"Harajuku",short:"Harajuku",jp:"原宿",g:"high",lat:35.6705,lng:139.7030,r:.7,p:2,tags:["temples","shop"],
  tag:"A forest shrine across the road from street style",
  intro:"Two worlds share one station. Meiji Jingu, Tokyo’s grandest shrine, sits in a forest planted with around 100,000 trees donated from across Japan. Over the road, Takeshita-dori is a crush of crêpes and teen fashion, while Cat Street, winding towards Shibuya, is the calmer middle ground.",
  see:["Meiji Jingu’s gravel approach and giant wooden torii, ideally early","Cat Street’s boutiques and vintage shops","Ten minutes of people-watching on Takeshita-dori"],
  l:["C"],t:"7 min",go:"Chiyoda line from Akasaka to Meiji-jingumae, 3 stops",when:"Before 9am at the shrine; November weekends bring families in kimono for Shichi-Go-San"},
 {id:"shibuya",name:"Shibuya",short:"Shibuya",jp:"渋谷",g:"high",lat:35.6590,lng:139.7020,r:.6,p:1,tags:["food","night","shop"],
  tag:"The crossing, and the backstreets beyond it",
  intro:"Shibuya is the Tokyo of postcards: giant screens and the scramble crossing, where crowds cross from every direction at once. Recent redevelopment added rooftop views and a riverside walk, and the backstreets of Okushibuya hide record shops, bookshops and good coffee.",
  see:["The scramble from above at Shibuya Sky (book a sunset slot)","The riverside walk at Shibuya Stream","Okushibuya’s independent shops and cafés"],
  l:["G"],t:"10 min",go:"Ginza line from Akasaka-mitsuke, direct (or the Hanzomon line from Nagatacho)",when:"Sunset for the views; evening for the buzz"},
 {id:"ebisu",name:"Ebisu, Daikanyama & Nakameguro",short:"Ebisu · Nakameguro",jp:"恵比寿・代官山・中目黒",g:"high",lat:35.6475,lng:139.7040,r:.9,p:2,tags:["books","shop","food"],
  tag:"Grown-up Tokyo: bookshops, boutiques and a river walk",
  intro:"South of Shibuya, this trio is where Tokyo goes to slow down. Daikanyama has low-rise boutiques and T-Site, a bookshop complex worth the trip on its own. Nakameguro follows the Meguro River past cafés and small labels, and Ebisu does izakaya and craft beer.",
  see:["The book and magazine floors of Daikanyama T-Site","A walk along the Meguro River in Nakameguro","Ebisu Yokocho, a covered alley of tiny food stalls"],
  l:["G"],t:"25 min",go:"Ginza line to Shibuya, then the Tokyu Toyoko line 1–2 stops to Daikanyama or Nakameguro",when:"A slow afternoon into early evening"},
 {id:"shimokita",name:"Shimokitazawa",short:"Shimokita",jp:"下北沢",g:"high",lat:35.6615,lng:139.6680,r:.5,p:1,tags:["shop","craft"],
  tag:"Vintage clothes, records and tiny theatres",
  intro:"Shimokitazawa is Tokyo’s capital of secondhand fashion, with dozens of vintage shops among small theatres, live-music venues and record stores. Since the railway went underground, new walkable spaces such as Bonus Track have brought indie shops and food. It’s good hunting ground for vintage fabric too.",
  see:["The vintage shops in the lanes around the station","Bonus Track’s small independent shops","A record-shop crawl"],
  l:["G"],t:"25 min",go:"Ginza line to Shibuya, then the Keio Inokashira line express, 1 stop",when:"Afternoon; most shops open around noon"},
 {id:"shinjuku",name:"Shinjuku",short:"Shinjuku",jp:"新宿",g:"high",lat:35.6905,lng:139.7030,r:.9,p:1,tags:["food","night","leaves","craft"],
  tag:"Neon, tiny bars and a perfect garden",
  intro:"Shinjuku Station is the busiest in the world, and the streets around it are Tokyo at full volume. Then there are the pockets: smoky yakitori stalls in Omoide Yokocho, Golden Gai’s lanes of bars that seat a handful, and Shinjuku Gyoen, one of the city’s best gardens for autumn colour.",
  see:["Shinjuku Gyoen’s Japanese garden, colouring from mid-November (entry fee)","Golden Gai after 9pm (many bars charge a cover)","Yakitori under the tracks at Omoide Yokocho"],
  l:["M"],t:"10 min",go:"Marunouchi line from Akasaka-mitsuke, direct (get off at Shinjuku-gyoemmae for the garden)",when:"The garden in the morning; the yokocho and Golden Gai at night"},
 {id:"kagurazaka",name:"Kagurazaka",short:"Kagurazaka",jp:"神楽坂",g:"high",lat:35.7020,lng:139.7390,r:.45,p:1,tags:["food","history","temples"],
  tag:"Stone lanes with a French accent",
  intro:"Kagurazaka climbs a hill from Iidabashi, and its side lanes are among Tokyo’s most atmospheric: stone-paved, narrow and lined with old ryotei. It was a geisha quarter, and a handful of geisha still work here. A French community has added bakeries and bistros.",
  see:["Hyogo Yokocho, the best-preserved of the stone lanes","Akagi Shrine, redesigned by Kengo Kuma","Pastries and coffee on the main slope"],
  l:["N"],t:"10 min",go:"Namboku line from Tameike-sanno or Nagatacho to Iidabashi",when:"Dusk, when the lanterns come on"},
 {id:"jimbocho",name:"Jimbocho",short:"Jimbocho",jp:"神保町",g:"central",lat:35.6958,lng:139.7577,r:.4,p:2,tags:["books"],
  tag:"Book Town",
  intro:"Jimbocho has well over 100 secondhand bookshops, from art-book specialists to carts of old prints and maps on the pavement. It’s the real setting of Days at the Morisaki Bookshop, and it’s famous for its curry houses, fuel for generations of students and browsers.",
  see:["The bookshops on the south side of Yasukuni-dori, which face north to keep sunlight off the books","Woodblock prints and old maps at the specialist dealers","A plate of curry in one of the old curry houses"],
  l:["Z"],t:"10 min",go:"Hanzomon line from Nagatacho, 3 stops (Nagatacho links underground to Akasaka-mitsuke)",when:"Weekday afternoons; some shops close on Sundays"},
 {id:"marunouchi",name:"Marunouchi & Tokyo Station",short:"Marunouchi",jp:"丸の内",g:"central",lat:35.6812,lng:139.7650,r:.6,p:2,tags:["history","food"],
  tag:"Red brick, palace moats and business suits",
  intro:"Tokyo Station’s red-brick Marunouchi building opened in 1914 and was restored to its original domes in 2012. Broad avenues run from it to the Imperial Palace, whose East Gardens are open to the public on the grounds of the old Edo Castle.",
  see:["KITTE’s rooftop garden, looking straight down on the station","The Imperial Palace East Gardens (usually closed Mondays and Fridays)","A walk along the palace moat at dusk"],
  l:["M"],t:"8 min",go:"Marunouchi line from Akasaka-mitsuke to Tokyo, direct",when:"Morning for the gardens; dusk for the station lit up"},
 {id:"ginza",name:"Ginza",short:"Ginza",jp:"銀座",g:"central",lat:35.6715,lng:139.7655,r:.6,p:1,tags:["shop","food"],
  tag:"Department-store glamour and a kabuki stage",
  intro:"Ginza is Tokyo’s grand shopping street, with flagship stores, department-store food halls and the Wako clock tower over its main crossing. Chuo-dori closes to cars on weekend afternoons. Kabuki-za usually sells single-act tickets, so you can try kabuki without giving it a whole day.",
  see:["A single act at Kabuki-za","Itoya’s many floors of stationery and paper","The depachika food halls in the department-store basements"],
  l:["G","M"],t:"6 min",go:"Ginza or Marunouchi line from Akasaka-mitsuke, direct",when:"Weekend afternoons for the car-free avenue"},
 {id:"nihonbashi",name:"Nihonbashi",short:"Nihonbashi",jp:"日本橋",g:"central",lat:35.6845,lng:139.7740,llat:35.6872,llng:139.7765,r:.5,p:2,tags:["craft","history","shop"],
  tag:"Where Edo did business",
  intro:"Nihonbashi was Edo’s merchant heart, and its bridge is still the point from which Japan’s road distances are measured. Some shops here have traded for centuries, selling washi paper, dried bonito and nori beside the grand Mitsukoshi department store.",
  see:["Haibara, selling washi paper since 1806","Mitsukoshi’s main store and its soaring central hall","The bridge itself, now under an expressway"],
  l:["G"],t:"12 min",go:"Ginza line from Akasaka-mitsuke to Mitsukoshimae, direct",when:"Weekday shop hours"},
 {id:"tsukiji",name:"Tsukiji",short:"Tsukiji",jp:"築地",g:"central",lat:35.6655,lng:139.7710,llat:35.6628,llng:139.7728,r:.35,p:2,tags:["food"],
  tag:"Breakfast at the old fish market",
  intro:"The wholesale fish market moved to Toyosu in 2018, but Tsukiji’s outer market stayed: a few blocks of stalls selling tamagoyaki, grilled seafood, knives and kitchen tools. Come early, as many stalls wind down by early afternoon.",

  l:["G"],t:"20 min",go:"Ginza line to Ginza, then a 10-minute walk",when:"Before 10am"},
 {id:"ueno",name:"Ueno",short:"Ueno",jp:"上野",g:"low",lat:35.7140,lng:139.7735,llat:35.7118,llng:139.7712,r:.7,p:1,tags:["art","history","food"],
  tag:"Museums, a lotus pond and a market",
  intro:"Ueno Park holds some of Japan’s great museums, including the Tokyo National Museum, the country’s oldest, founded in 1872. Below the park, Ameyoko is a loud, cheap market street that grew out of a postwar black market.",

  l:["G"],t:"20 min",go:"Ginza line from Akasaka-mitsuke to Ueno, direct",when:"Museums in the morning; Ameyoko in the late afternoon"},
 {id:"yanesen",name:"Yanaka, Nezu & Sendagi",short:"Yanesen",jp:"谷根千",g:"low",lat:35.7235,lng:139.7655,llat:35.7238,llng:139.7625,r:.7,p:1,tags:["history","temples","craft"],
  tag:"The old Tokyo that survived",
  intro:"Yanaka, Nezu and Sendagi, known together as Yanesen, came through the 1923 earthquake and the wartime bombing far better than most of the city. Wooden houses, small temples and family shops still line the lanes, and Yanaka Ginza, a short shopping street of croquettes and crafts, is the heart of it.",
  see:["Yanaka Ginza, ideally before lunch","Nezu Shrine and its tunnel of red torii","Yanaka Cemetery and the temple backstreets around it"],
  eat:["Kayaba Coffee, a kissaten dating from 1938"],
  l:["C"],t:"20 min",go:"Chiyoda line from Akasaka to Sendagi or Nezu, direct",when:"Morning, before the day-trippers"},
 {id:"nippori",name:"Nippori Fabric Town",short:"Fabric Town",jp:"日暮里繊維街",g:"low",lat:35.7295,lng:139.7745,llat:35.7322,llng:139.7775,r:.3,p:2,tags:["craft"],
  tag:"Eighty-plus fabric shops on one street",
  intro:"Nippori Chuo-dori is Tokyo’s textile street, with over 80 shops selling fabric by the metre, from 100-yen remnants to kimono silk, plus buttons, ribbons and trims. Signs on the station floor lead you there.",

  l:["C"],t:"25 min",go:"Chiyoda line to Nishi-Nippori, then one JR stop to Nippori (or walk over from Yanaka)",when:"Weekdays; check opening days before you go"},
 {id:"asakusa",name:"Asakusa",short:"Asakusa",jp:"浅草",g:"low",lat:35.7130,lng:139.7955,r:.55,p:1,tags:["temples","craft","food","history"],
  tag:"Lanterns, incense and Edo spirit",
  intro:"Senso-ji, founded in the 7th century, is Tokyo’s oldest temple, approached through the giant lantern of Kaminarimon and the stalls of Nakamise. The streets around it keep an old-town feel, with craft shops, rickshaws and outdoor izakaya.",
  see:["Senso-ji before 8am or after dark, when it’s lit and quiet","Kappabashi’s kitchenware street (weekdays; bring cash)","Hoppy Street’s outdoor izakaya (expect a table charge)"],
  l:["G"],t:"25 min",go:"Ginza line from Akasaka-mitsuke to Asakusa, direct",when:"Early morning or after dark"},
 {id:"kuramae",name:"Kuramae",short:"Kuramae",jp:"蔵前",g:"low",lat:35.7035,lng:139.7895,r:.45,p:2,tags:["craft","food"],
  tag:"Makers by the river",
  intro:"Kuramae takes its name from the shogun’s rice storehouses that once lined the Sumida here. Today its old workshops and warehouses hold small makers: leather goods, stationery, natural dyeing, coffee roasters and chocolate.",

  l:["G"],t:"25 min",go:"Ginza line to Tawaramachi, then a 10-minute walk (or 20 minutes on foot from Asakusa)",when:"Wednesday to Sunday; many small shops close early in the week"},
 {id:"skytree",name:"Oshiage & Skytree",short:"Skytree",jp:"押上",g:"low",lat:35.7101,lng:139.8107,llat:35.7076,llng:139.8122,r:.4,p:2,tags:["food"],
  tag:"Tokyo from 634 metres",

 {id:"kiyosumi",name:"Kiyosumi-Shirakawa",short:"Kiyosumi",jp:"清澄白河",g:"low",lat:35.6810,lng:139.7995,llat:35.6788,llng:139.8010,r:.55,p:1,tags:["art","food"],

 "13101":{tag:"The old castle and the book town",t:"Chiyoda is built around the Imperial Palace, which sits on the grounds of Edo Castle, the shogun's seat until 1868. Around it: government and business districts, Jimbocho's secondhand bookshops, and Akihabara's electronics-turned-anime streets."},
 "13102":{tag:"Edo's merchants, Ginza's glamour",t:"Chuo holds Nihonbashi, the bridge from which Japan's road distances are still measured, and Ginza, laid out in the 1870s as Tokyo's first Western-style brick district. Tsukiji's outer market and Tokyo Station's east side complete it."},
 "13103":{tag:"Embassies, art museums and late nights",t:"Minato spans Akasaka's lantern-lit alleys, Roppongi's art triangle and nightlife, Azabu's embassy streets and the Tokyo Tower area. It runs from the old samurai hills down to the bay."},
 "13104":{tag:"Every Tokyo at once",t:"Shinjuku ward covers the world's busiest station, Kabukicho, Golden Gai and Omoide Yokocho, but also Shinjuku Gyoen's garden and Kagurazaka's stone-paved lanes, a former geisha quarter with a French accent."},
 "13105":{tag:"Quiet, scholarly Tokyo",t:"Home to the University of Tokyo and two of the city's finest Edo-period gardens, Koishikawa Korakuen and Rikugien. Nezu and Sendagi, the 'Yanesen' lanes, spill over from Taito."},
 "13106":{tag:"Shitamachi: the old low city",t:"Taito is old Edo's working heart: Senso-ji, founded in the 7th century, Ueno's museums and Ameyoko market, Yanaka's temple lanes and Kuramae's makers. Much of it escaped the 1945 firebombing."},
 "13107":{tag:"Sumo, Skytree and Hokusai",t:"Sumida sits east of the river. Tokyo Skytree rises at Oshiage, Ryogoku is the home of sumo, and the Sumida Hokusai Museum celebrates the ukiyo-e master who was born here."},
 "13108":{tag:"Warehouses, coffee and the bay",t:"Koto is reclaimed land and old canals: Kiyosumi-Shirakawa's roasteries and contemporary art, Toyosu's fish market, and the bay-side exhibition sites."},
 "13109":{tag:"Shinkansen gateway",t:"Shinagawa Station is the main southern stop for bullet trains. The ward also has the Takanawa waterfront and the old Tokaido post town of Shinagawa-shuku."},
 "13110":{tag:"Canal-side calm",t:"Meguro is mostly residential. Nakameguro's river walk, lined with cherry trees and small cafés, is the draw, along with the quiet design streets towards Daikanyama."},
 "13111":{tag:"Airport ward",t:"Ota includes Haneda Airport and a lot of residential Tokyo. Nothing saved here, but it is where you might land if you fly into Haneda."},
 "13112":{tag:"The suburban west",t:"Setagaya is Tokyo's biggest ward by population, mostly low-rise and residential. Shimokitazawa, its vintage-clothes and live-music corner, is the reason to visit."},
 "13113":{tag:"Youth culture and the forest shrine",t:"Shibuya ward covers the Scramble Crossing, Harajuku's street fashion, Omotesando's architecture, Ebisu and Daikanyama's quieter streets, and Meiji Jingu's forest, planted from 1915."},
 "13114":{tag:"Subculture city",t:"Nakano is best known for Nakano Broadway, a four-storey mall of anime, manga and collectible shops, and for the neighbourhood izakaya under the station."},
 "13115":{tag:"Punk, vintage and long-running bars",t:"Suginami's Koenji is Tokyo's punk and vintage-clothing neighbourhood, with Asagaya and Ogikubo's calm, café-lined streets to the west."},
 "13116":{tag:"Ikebukuro and its otaku streets",t:"Toshima's Ikebukuro is another major rail hub, with department stores and, on Otome Road, an anime-fan scene aimed at women."},
 "13203":{tag:"Tokyo's most liveable corner",t:"Musashino city holds Kichijoji, repeatedly voted the best place in Greater Tokyo to live, plus Inokashira Park's boating pond."},
 "13204":{tag:"Home of the Ghibli Museum",t:"Mitaka sits just west of Kichijoji. The Ghibli Museum sits in Inokashira Park's edge, a short walk or cycle from the Kichijoji side."},
 "26105":{tag:"Old Kyoto in wood and stone",t:"Higashiyama is the eastern hills: Kiyomizu-dera, the preserved lanes of Sannenzaka and Ninenzaka, and Gion, still a working geisha district."},

 "26106":{tag:"Station Kyoto",t:"Shimogyo is Kyoto Station, the temples Higashi and Nishi Hongan-ji, and the old Shijo shopping streets."},
 "26101":{tag:"North Kyoto temples",t:"Kita contains Kinkaku-ji's gold-leaf pavilion, Daitoku-ji's zen subtemples and, further north, mountain villages."},
 "26102":{tag:"Imperial Kyoto",t:"Kamigyo holds the Kyoto Imperial Palace park and Nishijin, the textile district where kimono silk has been woven for centuries."},
 "26103":{tag:"Scholars, rivers and mountains",t:"Sakyo is Kyoto University, the Philosopher's Path, Nanzen-ji, Demachiyanagi's river delta and, far north, Kurama and Kibune."},

 "27128":{tag:"Minami: Dotonbori and the castle",t:"Chuo is Osaka's central core: Dotonbori's neon canal, Shinsaibashi's arcades, Amerikamura's youth fashion and Osaka Castle park."},

WARDINFO["13117"]={tag:"The northern edge, river and rail",t:"Kita sits at the top of the 23 wards along the Arakawa and Sumida rivers. Asukayama Park was planted with cherry trees in the 1720s for the shogun Yoshimune, Oji Inari shrine hosts a New Year's Eve parade of people dressed as foxes, and Akabane's station streets are known for cheap, lively izakaya."};
WARDINFO["13118"]={tag:"Old working-class Tokyo by the river",t:"Arakawa is a compact shitamachi ward. The Toden Arakawa line, Tokyo's last surviving tram, runs through it, and the Nippori fabric street sits on its western edge."};
WARDINFO["13119"]={tag:"The first stop on the Nakasendo",t:"Itabashi was the first post town on the Nakasendo leaving Edo, so the road you will walk in the Kiso valley begins here. Today it is a quiet residential ward with the Itabashi Art Museum."};
WARDINFO["13120"]={tag:"Green suburbs and anime studios",t:"Nerima is often called the birthplace of Japanese TV animation: Toei Animation is based in Oizumi, with a small gallery by the station. It is also known for its radishes and for the Warner Bros. Studio Tour Tokyo, the Making of Harry Potter, on the former Toshimaen amusement park site."};
WARDINFO["13121"]={tag:"Fireworks and an Edo post town",t:"Adachi's Kita-Senju grew from Senju-juku, the first post station on the Nikko and Oshu roads out of Edo, and is now a major rail hub. The ward's big summer fireworks festival is held over the Arakawa river."};
WARDINFO["13122"]={tag:"Tora-san country",t:"Katsushika is the setting of the long-running film series Otoko wa Tsurai yo. Shibamata has a temple approach, Taishakuten, a Tora-san museum and old-town snacks, and Kameari is known for the manga hero Kochikame, whose statues stand outside the station."};
WARDINFO["13123"]={tag:"Tokyo's eastern edge along the Edo River",t:"Edogawa has Kasai Rinkai Park, with a large Ferris wheel and an aquarium by the bay, and a thriving Indian community around Nishi-Kasai that locals call Little India."};
WARDINFO["27102"]={tag:"Riverside residential",t:"Miyakojima lies along the Yodo river. Kema Sakuranomiya Park is a long riverside stretch of cherry trees, a popular spring picnic spot."};
WARDINFO["27104"]={tag:"The bay and the theme park",t:"Konohana is where Universal Studios Japan sits on the bay, and its Yumeshima island hosted the Osaka-Kansai Expo in 2025."};
WARDINFO["27107"]={tag:"Aquarium and harbour",t:"Minato ward holds Osaka's bayside Tempozan harbour village, with the Kaiyukan aquarium and the Tempozan Ferris wheel."};
WARDINFO["27108"]={tag:"Osaka's Okinawan quarter",t:"Taisho is home to one of the largest Okinawan communities outside Okinawa, and you can find Okinawan food and shops in its streets."};
WARDINFO["27113"]={tag:"Residential and industrial, bay side",t:"Nishiyodogawa is a residential and light-industrial ward on the bay side of the Yodo river, mostly of interest to locals."};
WARDINFO["27114"]={tag:"Residential north",t:"Higashiyodogawa is a residential ward in north Osaka, north of the Yodo river."};
WARDINFO["27123"]={tag:"Shin-Osaka and the Shinkansen",t:"Yodogawa contains Shin-Osaka Station, where the Shinkansen arrives. Most visitors only pass through it on the way to the city centre."};
WARDINFO["27115"]={tag:"Quiet east Osaka",t:"Higashinari is a small, mostly residential ward east of the centre."};
WARDINFO["27116"]={tag:"Osaka's Korea Town",t:"Ikuno is home to Japan's largest Korean community. The Tsuruhashi and Miyuki-dori area is known for yakiniku restaurants, kimchi shops and a busy market street."};
WARDINFO["27117"]={tag:"Residential north-east",t:"Asahi is a quiet residential ward in north-east Osaka."};
WARDINFO["27118"]={tag:"Residential east",t:"Joto is a mostly residential ward east of Osaka Castle."};
WARDINFO["27120"]={tag:"One of Japan's oldest shrines",t:"Sumiyoshi ward is named for Sumiyoshi Taisha, a shrine traditionally dated to the 3rd century, known for its steep arched Sorihashi bridge and for being the head shrine of 2,000 Sumiyoshi shrines across Japan."};
WARDINFO["27121"]={tag:"Parks and neighbourhood Osaka",t:"Higashisumiyoshi is residential, with the big Nagai Park (stadium, botanical garden and the natural history museum) on its edge."};
WARDINFO["27124"]={tag:"Expo '90 park",t:"Tsurumi hosted the 1990 International Garden and Greenery Exposition, and Tsurumi Ryokuchi Park is its legacy."};
WARDINFO["27125"]={tag:"Port and bay",t:"Suminoe is Osaka's port and bayfront, with Sakishima's Cosmo Tower and the Nanko wild bird sanctuary."};

 asakusa:{
  h:["Tradition dates Senso-ji to 628, when two fishermen netted a small Kannon image from the Sumida River; a village headman is said to have turned his house into its first shrine. A priest re-established the temple in 645, which is why you also see 645 quoted.",

  c:["Traditional tsugaru-shamisen is still performed in some local izakaya.","Kappabashi, a short walk west, is the knife and kitchenware street. Sources disagree on its age (some say about 1912, others far older), but it now has around 170 specialist shops."],

 ueno:{

 yanesen:{

 kuramae:{

 nihonbashi:{

 tsukiji:{

 shinjuku:{

  c:["Golden Gai bars seat a handful of people each and often set a cover charge or a regulars-first policy; look for signs in English."],
  f:["Yakitori smoke at Omoide Yokocho is the classic first-night Shinjuku scene."],

 harajuku:{

  s:[["Wikipedia: Harajuku","https://en.wikipedia.org/wiki/Harajuku"]]},
 akihabara:{

 kagurazaka:{
  h:["An Edo-period temple town (the Bishamonten temple, Zenkoku-ji, drew crowds) that grew into a major hanamachi. One estimate puts the pre-1923 numbers at about 150 ryotei and 600 geisha; a 2005 count found 34 geisha and 9 ryotei, so it is smaller but still working.",
     "It became Tokyo's unofficial French quarter through the nearby French institute and school, and now has the city's densest cluster of French bakeries, bistros and cheese shops."],
  s:[["Tokyo Updates: Kagurazaka","https://www.tokyoupdates.metro.tokyo.lg.jp/en/post-978/"],["Metropolis: Kagurazaka guide","https://metropolisjapan.com/?p=204950"]]},
 jimbocho:{
  h:["Named for a 17th-century samurai, Nagaharu Jinbo. Law schools opened here in the early 1880s, and the secondhand textbook trade for students grew into a book town.",

  f:["Curry houses and vintage cafés feed the browsers; Ladrio, opened in 1949 as a bookshop reading room, is credited with bringing Viennese coffee to Japan."],

  s:[["Time Out: What kind of town is Jimbocho","https://www.timeout.com/tokyo/things-to-do/what-kind-of-town-is-jimbocho-a-story-of-antiquarian-books-and-publishing"],["Atlas Obscura: Jimbocho Book Town","https://www.atlasobscura.com/places/jimbocho-book-town"]]},
 shimokita:{

 koenji:{

 roppongi:{

 kiyosumi:{

 higashiyama:{
  h:["Kiyomizu-yaki, Kyoto's best-known pottery, grew along the slopes below Kiyomizu-dera, flourishing from the early 1600s with the rise of tea ceremony ceramics. The earliest known Kyoto ceramics date back some 1,200 years to Seikanji Temple."],

 gion:{

  h:["Nishiki's start date is contested: sources say the 8th century, the Heian period, around 1310, or official permission in 1615. Either way it has fed Kyoto for centuries and earned the name 'Kyoto's kitchen'.",
     "Pontocho, between Shijo and Sanjo, is one of the five kagai."],
  f:["Nishiki is the place for tsukemono (pickles), fresh tofu and yuba, miso and Uji tea. Kyoto vegetables (kyo-yasai) have been officially promoted as a brand since 1998. Obanzai, many small home-style plates, is the everyday cooking. Kaiseki grew from tea ceremony meals, and Nanzenji's yudofu is the classic temple dish."],
  s:[["Arigato Japan: Nishiki Market history","https://arigatojapan.co.jp/history-of-nishiki-market/"],["Table Journey: Kyoto food history","https://tablejourney.com/japan/kyoto/food-history/"],["Lonely Planet: Nishiki Market","https://www.lonelyplanet.com/pois/402526"]]},
 fushimi:{
  h:["Gekkeikan's founder, Jiemon Okura, started brewing in Fushimi in 1637, drawn by the district's plentiful, soft, low-iron water. The company's museum describes how brewing moved to year-round production."],
  f:["Sake tasting at the Gekkeikan Okura museum or in the small breweries is the tradition; the inari-zushi that goes with Fushimi Inari is the shrine's food."],
  t:["The Ohitaki fire festival at Fushimi Inari is on 8 November."],
  s:[["Gekkeikan: history","https://us.gekkeikan.com/about/history/"],["Kyoto Museums: Gekkeikan Okura","https://www.kyoto-museums.jp/en/museum/south/3901"]]},
 arashiyama:{
  h:["Heian-period courtiers built retreats here; Retired Emperor Go-Saga had cherries brought from Mt Yoshino. Tenryu-ji was founded in 1339 by Ashikaga Takauji to console the spirit of Emperor Go-Daigo, and its garden by Muso Soseki is a standard example of 'borrowed scenery' (shakkei)."],
  t:["The bridge's naming story, tied to Emperor Kameyama's moon-viewing, doesn't quite fit the Heian dating some guides give it."],
  s:[["JNTO: Arashiyama","https://www.japan.travel/en/spot/1142/"],["Japan Experience: Arashiyama and Sagano","https://www.japan-experience.com/all-about-japan/kyoto/attractions-excursions/arashiyama-sagano"]]},
 kinkakuji:{
  h:["Built as a retirement villa for the shogun Ashikaga Yoshimitsu in the 1390s and turned into a Zen temple after his death; the present gilded pavilion is a 1955 rebuild after an arson fire in 1950. Ryoan-ji's rock garden, a short bus ride away, dates from the late 15th century."],
  s:[["Wikipedia: Kinkaku-ji","https://en.wikipedia.org/wiki/Kinkaku-ji"]]},
 demachiyanagi:{
  h:["The point where the Kamo and Takano rivers meet is a popular hangout for Kyoto University students."],
  s:[["Culture Trip: Coolest neighbourhoods in Kyoto","https://theculturetrip.com/asia/japan/articles/the-5-coolest-neighborhoods-in-kyoto"]]},
 kurama:{
  h:["Kurama-dera is traced to 770, when the monk Gantei enshrined Bishamonten. The best-known legend is that the young Minamoto no Yoshitsune, sent here to train as a monk, was taught swordsmanship by the tengu Sojobo, though that part comes from later tradition and a Muromachi Noh play, 'Kurama Tengu'.",
     "The path from Kurama to Kibune runs through the 'Tengu Forest' valley."],
  s:[["Yokai.jp: Kurama Sojobo","https://yokai.jp/en/yokai/kurama-sojobo"],["Discover Kyoto: Kurama-dera","https://www.discoverkyoto.com/places-go/kurama-dera/"]]},
 dotonbori:{
  h:["The canal was dug between about 1612 and 1615; the new lord of Osaka Castle named it after its builder (Nariyasu Doton), and the story later shifted to a fictional merchant, Yasui Doton.",
     "From 1621 the shogunate designated the canal-side as Osaka's theatre district. At its peak there were kabuki houses, bunraku houses (Takemoto-za and Toyotake-za) and the Karakuri mechanical theatre; Chikamatsu's 'Love Suicides at Sonezaki' premiered at Takemoto-za in 1703.",
     "Cinema, then the war, ended the theatre era, and the area was rebuilt as a food-and-neon district. The Glico sign dates to 1935."],
  f:["Takoyaki is credited to Endo Tomekichi of Aizuya in the 1930s (he began with 'rajioyaki' in 1933, then added octopus). Kushikatsu Daruma opened in 1929."],
  s:[["Wikipedia: Dotonbori","https://en.wikipedia.org/wiki/D%C5%8Dtonbori"],["MLIT: Dotonbori","https://www.mlit.go.jp/tagengo-db/en/R4-00636.html"],["Unseen Japan: Takoyaki history","https://unseen-japan.com/takoyaki-japan-history/"],["Culture Trip: Osaka neighbourhoods","https://theculturetrip.com/asia/japan/osaka/articles/a-comprehensive-neighborhood-guide-to-osaka"]]},
 shinsekai:{
  h:["Laid out in 1912 to showcase Osaka as a modern city, with Coney Island and Paris as models and then the tallest structure in Asia. Its heyday came after the war, and the retro look froze after that.",
     "Kushikatsu, deep-fried skewers, is especially associated with Shinsekai; Daruma opened in 1929."],
  s:[["Culture Trip: Osaka neighbourhoods","https://theculturetrip.com/asia/japan/osaka/articles/a-comprehensive-neighborhood-guide-to-osaka"],["Lonely Planet: five Osaka dishes","https://www.lonelyplanet.com/articles/five-must-try-dishes-from-osaka"]]},
 amemura:{
  h:["The name comes from the shops selling imported American goods after 1965; in the 1970s renovated warehouses sold secondhand clothes and jeans. Before that the area was linked to the Edo-period charcoal trade."],
  s:[["Osaka Info: Amerikamura","https://osaka-info.jp/en/spot/america-mura-american-village/"]]},
 umeda:{
  h:["The Umeda Sky Building, by Hiroshi Hara, opened in 1993. It was conceived in 1988 as part of a four-tower 'City of Air', cut to two towers after the bubble burst. Its success helped turn Umeda from a business district into a shopping and sightseeing one."],
  s:[["Wikipedia: Umeda Sky Building","https://en.wikipedia.org/wiki/Umeda_Sky_Building"]]},
 osakacastle:{
  h:["Toyotomi Hideyoshi began the castle in 1583 on the site of the Ishiyama Honganji temple fortress. The Toyotomi were destroyed in the sieges of 1614 and 1615, the shogunate rebuilt the castle in the 1620s, lightning burned the keep in 1665, and the present concrete keep dates from 1931."],
  s:[["Wikipedia: Osaka Castle","https://en.wikipedia.org/wiki/Osaka_Castle"]]},
 nakazaki:{
  h:["One of the few Osaka neighbourhoods to escape the wartime bombing. It sat run-down until its prewar buildings were reborn as galleries, cafés and vintage shops; the revival is often traced to Salon de AManTO opening in a 120-year-old building in 2001."],
  c:["A good place to spend an afternoon with craft shops, small galleries and independent cafés."],
  s:[["Culture Trip: Things to do in Nakazakicho","https://theculturetrip.com/asia/japan/osaka/articles/the-best-things-to-do-in-nakazakicho"]]},
 magome:{
  h:["Toson Shimazaki, born here in 1872, wrote the historical novel 'Before the Dawn', serialised from 1929 to 1935. His father ran the Magome honjin, now the Toson Memorial Museum. A fire in 1895 destroyed much of the town, and the post-town economy faded after the railway came in 1909."],
  c:["Magome is more polished and restored, Tsumago more rugged and authentic; Magome's views over the valley come with its hillside setting."],
  t:["Hotel and minshuku meals are usually included because there are few dining options once the day-trippers leave, and cash is wise since some inns do not take cards."],
  s:[["Wikipedia: Nakasendo","https://en.wikipedia.org/wiki/Nakasend%C5%8D"],["Japan Guide: Magome-Tsumago Trail","https://www.japan-guide.com/e/e6078.html"]]},
 trail:{
  t:["Luggage forwarding between the two towns: drop bags at the tourist office between 8:30 and 11:30, collect at the other end from 13:00 to 17:00, for ¥1,000 per item, normally from 20 March to the end of November. Check the exact end date and any weekend-only rule before you go.",
     "Magome to Tsumago has the climb first (roughly a quarter to a third of the way) then mostly downhill, ending on a long stony descent. Allow about three hours, start before 14:00 in winter since there are no lights, and ask for a bear bell at the tourist office."],
  s:[["Japan Guide: Magome-Tsumago Trail","https://www.japan-guide.com/e/e6078.html"],["FlyerTalk: trail discussion","https://www.flyertalk.com/forum/4675037-post1.html"]]},
 tsumago:{
  h:["Tsumago began restoring its post-town streets in the late 1960s and later adopted a resident pledge not to sell, rent or demolish historic buildings, which became a model for preservation towns in Japan (sources I could reach did not confirm the exact dates)."],
  s:[["Japan Guide: Magome-Tsumago Trail","https://www.japan-guide.com/e/e6078.html"],["Wikipedia: Nakasendo","https://en.wikipedia.org/wiki/Nakasend%C5%8D"]]},
 hakone:{
  h:["The legend: Kobo Daishi encouraged locals to eat eggs boiled in the valley's hot springs, and each black egg is said to add seven years of life; the science does not support that. The valley formed in an eruption about 3,000 years ago.",
     "The shells turn black because sulphur and iron in the water react with them. One source dates the commercial black egg to about 1955 and the ropeway's opening in 1959, but I could only find that in one place."],
  s:[["Atlas Obscura: Owakudani black eggs","https://assets.atlasobscura.com/places/owakudani-black-eggs"],["Amusing Planet: The black eggs","https://www.amusingplanet.com/2015/12/the-black-eggs-of-owakudani.html"]]}
};

/* Threads running through each place, for the overview panel */
var THEMES={
 tokyo:[
  {t:"Sushi began as street food",d:"Edo-style nigiri took shape in the early 1800s (the Bunsei era, 1818 to 1831), with Hanaya Yohei of Ryogoku named as a pioneer. It started as fast food eaten standing at stalls, with pieces about two to three times today's size.",s:["Unseen Japan: Edo-mae sushi","https://unseen-japan.com/edomae-sushi/"]},
  {t:"Edo crafts survive in the east",d:"Edo kiriko, cut glass, is credited to the glass dealer Kagaya Kyubei in 1834; Tokyo recognised it as a traditional craft in 1985 and the national government in 2002. Most workshops are in Koto, Edogawa and Sumida wards.",s:["Wikipedia: Edo kiriko","https://en.wikipedia.org/wiki/Edo_kiriko"]},
  {t:"Black markets became bar alleys",d:"Ameyoko, Omoide Yokocho, Golden Gai and Akihabara's radio stalls all began as postwar markets, and kept the tiny-stall layout.",s:["Unseen Japan: Shinjuku history","https://unseen-japan.com/history-of-shinjuku-part-2/"]},
  {t:"Two disasters shaped the map",d:"The 1923 earthquake pushed people out of the old city (Shimokitazawa, Kagurazaka's decline) and moved the fish market to Tsukiji; the 1945 firebombing flattened the east but spared pockets like Yanaka, Jimbocho and Nezu.",s:["GO TOKYO: Tsukiji","https://www.gotokyo.org/en/spot/65/"]}
 ],
 nakasendo:[
  {t:"The road from Edo",d:"The Nakasendo was the inland highway between Edo and Kyoto, with 69 post towns; Magome was the 43rd. Nihonbashi bridge in Tokyo was its starting point.",s:["Wikipedia: Nakasendo","https://en.wikipedia.org/wiki/Nakasend%C5%8D"]},
  {t:"Practical notes from walkers",d:"Plan about three hours between the towns, pack warm layers and rain gear, and use a bear bell. FlyerTalk threads and Japan Guide agree on the luggage-forwarding routine and the Magome to Tsumago direction.",s:["Japan Guide: Magome-Tsumago Trail","https://www.japan-guide.com/e/e6078.html"]}
 ],
 kyoto:[
  {t:"Five geisha districts",d:"Gion Kobu, Gion Higashi, Pontocho, Kamishichiken and Miyagawacho make up Kyoto's five kagai; Pontocho and Gion are the easiest to visit.",s:["GLT: Gion guide","https://www.gltjp.com/en/article/item/20708/"]},
  {t:"Three craft traditions",d:"Kiyomizu-yaki pottery (below Kiyomizu-dera, from the early 1600s); Nishijin-ori brocade weaving, regrouped in the Nishijin district after the Onin War; and Kyo-yuzen dyeing, where each stage is done by a different specialist. Hosoo, a Nishijin textile house founded in 1688, has a showroom.",s:["Kyoto Prefecture: traditional crafts","https://www.pref.kyoto.jp/en/01-02-01.html"]},
  {t:"Temple cooking",d:"Kaiseki grew out of tea ceremony meals, yudofu is the temple-town classic, and obanzai means everyday small plates. Kyo-yasai vegetables have been promoted as a regional brand since 1998.",s:["Table Journey: Kyoto food history","https://tablejourney.com/japan/kyoto/food-history/"]},
  {t:"Autumn colour timing",d:"Guides disagree: one puts the peak from late November into early December, and one 2026 forecast suggests 20 November to 7 December. A mid-November visit may be just before peak.",s:["Self Guide Japan: Kyoto autumn 2026","https://selfguidejapan.com/blog/kyoto-autumn-leaves-2026"]}
 ],
 osaka:[
  {t:"A theatre street that turned into a food street",d:"Dotonbori was designated a theatre district in 1621, with kabuki, bunraku and mechanical-puppet houses. When cinema and the war ended that, food and neon took over.",s:["MLIT: Dotonbori","https://www.mlit.go.jp/tagengo-db/en/R4-00636.html"]},
  {t:"Street foods with a named inventor",d:"Takoyaki is credited to Endo Tomekichi of Aizuya in the 1930s; kushikatsu to Shinsekai, with Daruma opening in 1929.",s:["Unseen Japan: Takoyaki","https://unseen-japan.com/takoyaki-japan-history/"]},
  {t:"A merchant city's castle",d:"Hideyoshi's castle (1583) on the site of a temple fortress, destroyed in 1615 and rebuilt by the shogunate, burned in 1665, and rebuilt in concrete in 1931.",s:["Wikipedia: Osaka Castle","https://en.wikipedia.org/wiki/Osaka_Castle"]}
 ]
