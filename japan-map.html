/* ---------- Lore, second pass: fills every area with history, culture & craft, food and notes ---------- */
function addLore(id,o){
  var l=LORE[id]||(LORE[id]={});
  ["h","c","f","t"].forEach(function(k){if(o[k])l[k]=(l[k]||[]).concat(o[k])});
  if(o.s){l.s=l.s||[];o.s.forEach(function(x){if(!l.s.some(function(y){return y[1]===x[1]}))l.s.push(x)})}
}

/* ===== TOKYO ===== */
addLore("akasaka",{
 h:["Akasaka began as samurai land and was later settled by high-ranking government officials, military leaders and businessmen. Geisha houses and exclusive restaurants followed to entertain them, which is how the district became a hanamachi.",
    "The hanamachi faded with the end of the bubble economy, but Akasaka stayed a place where politics, business and diplomacy meet. Hie Shrine, long worshipped as the guardian of Edo Castle, lost most of its prewar buildings in the war; the present ones are postwar concrete, and the small Sanno Inari shrine from 1659 is the one surviving feudal-era structure.",
    "Akasaka Palace, the neo-baroque building on the district's edge, was completed in 1909 as a residence for the crown prince and is now the state guest house."],
 c:["Hie Shrine's Sanno Festival is held in mid-June every other year, and counts as one of Japan's three great festivals alongside Kyoto's Gion and Osaka's Tenjin. Its origin is the Edo-period procession that carried a portable shrine into the castle grounds.",
    "Classical ryotei still stand on the side streets, and some have become cafés, bars and a hostel. The area is also a media district: TBS has its headquarters and the Akasaka ACT Theater beside the main intersection."],
 f:["Akasaka's food is built around business entertaining: kaiseki in old ryotei, power lunches, and the lantern-lit izakaya and Korean restaurants tucked into the side lanes."],
 t:["The shrine can be entered by an escalator from the road or up the torii steps; early morning is quietest."],
 s:[["Wattention: The History of Akasaka","https://wattention.com/the-history-of-akasaka/2/"],["Visiting Japan: Hie Shrine","https://visiting-japan.com/en/articles/tokyo/e13cy-hie-jinja.htm"],["GLT: Akasaka area","https://www.gltjp.com/en/catalog/directory/spot/newest/208/"]]});

addLore("roppongi",{
 h:["The name is usually dated to around 1660. A folk explanation says it comes from six daimyo who lived nearby, though that is a legend. The army's presence after 1890 fed a nightlife scene, and after 1945 the US forces took over several sites here, with Hardy Barracks the most important.",
    "That occupation gave Roppongi its reputation as the foreigners' neighbourhood, with bars, restaurants and brothels around the bases. Roppongi Hills opened in 2003 and Tokyo Midtown in 2006 or 2007 (sources disagree), which turned a nightlife district into a daytime culture one."],
 c:["The 'Art Triangle' links the Mori Art Museum, the Suntory Museum of Art in Midtown and the National Art Center, all within a short walk.","Mori Art Museum has no permanent collection, so every visit is a new exhibition."],
 f:["Eating here is international and late. Roppongi's best meals are usually in the Hills and Midtown complexes at lunch, with the older nightlife streets best kept for later."],
 s:[["Wikipedia: Roppongi","https://en.wikipedia.org/wiki/Roppongi"],["JRPass: Visitor's guide to Roppongi","https://www.jrpass.com/it/blog/the-visitors-guide-to-roppongi"]]});

addLore("aoyama",{
 h:["Omotesando was created in the Taisho era (1912 to 1926) as the grand approach to Meiji Shrine, and the zelkova trees along it give the avenue its shade.",
    "After the 1923 earthquake, the Dojunkai Aoyama Apartments were built in reinforced concrete (1926 or 1927, depending on the source) with modern plumbing. In the 1960s they became a warren of artist studios and creative labs. They decayed and were replaced by Omotesando Hills in 2006, designed by Tadao Ando, whose spiral ramps echo the slope of the avenue."],
 c:["Omotesando is considered one of the world's great streets for contemporary architecture, with flagship buildings by several famous architects. Away from the avenue, Aoyama is quieter: galleries, design shops and the Nezu Museum's hillside garden.",
    "Aoyama Cemetery, one of Tokyo's first public cemeteries, is an unexpectedly quiet green space nearby."],
 f:["The avenue is for coffee, tea and patisserie, with small cafés and tea rooms in the back lanes of Aoyama."],
 s:[["Wikipedia: Omotesando","https://en.wikipedia.org/wiki/Omotesand%C5%8D"],["Arch Journey: Omotesando Hills","https://archjourney.org/projects/omotesando-hills/"],["Rise: Omotesando area guide","https://rise-corp.tokyo/ja/pages/tokyo-area-guide-omotesando"]]});

addLore("harajuku",{
 c:["Takeshita Street is only about 400 metres long. In the 1990s it was the place for bootleg American fashion until the laws tightened. Cat Street, the quieter walk toward Shibuya, is where the boutiques, vintage shops and cafés are.",
    "In the 1970s, impromptu rock and dance performances every Sunday on the closed-off streets helped make Harajuku Tokyo's street-fashion capital."],
 f:["The Harajuku crepe is the signature snack: American-style, Japanese-sized, filled with cream, cheesecake or brownie. Marion Crepes has been selling them since 1976."],
 s:[["JW Web Magazine: Harajuku guide","https://jw-webmagazine.com/tips/harajuku-guide/"],["Fun Japan: Takeshita Street","https://fun-japan.jp/en/articles/11873"]]});

addLore("shibuya",{
 h:["Shibuya's history runs back to the Shibuya clan and a castle said to date from 1092 on the high ground near the present station (the site of Konno Hachimangu Shrine). In the Edo period the slopes of Dogenzaka and Miyamasuzaka were part of the Oyama pilgrimage road, a busy resting stop.",
    "The station opened in 1885, and the crossing took its modern form in 1932 when the Tokyu Toyoko Line arrived. The Hachiko statue, a loyal dog who waited for his owner, a Tokyo University professor, was unveiled at the station in 1934, and Hachiko died the next year (accounts of the professor's name and the exact years of waiting vary).",
    "The Shibuya River was partly covered over around the 1964 Olympics and runs beneath the station; the Shibuya Stream redevelopment in 2018 brought a section back into daylight."],
 c:["Center Gai is the pedestrian street that feeds the crossing; Koen-dori, Dogenzaka and Spain-zaka lead off it to quieter, more interesting corners."],
 f:["New ramen shops keep opening along Dogenzaka and Miyamasuzaka, and the small bars around the tracks keep the neighbourhood's after-dark life going."],
 s:[["Culture Trip: A short history of Shibuya Crossing","https://www.theculturetrip.com/asia/japan/articles/tokyos-most-iconic-attraction-shibuya-crossing"],["Japan Travel: Hachiko","https://en.japantravel.com/places/tokyo/hachiko-statue/792"],["Wikipedia: Shibuya River","https://en.wikipedia.org/wiki/Shibuya_River"],["Kupi: Shibuya history","https://kupi.com/en/explore/japan/shibuya/history"]]});

addLore("ebisu",{
 h:["Ebisu is named after a beer. The Japan Beer Brewery was established in 1887, its brewery in Meguro was built around 1889, and Yebisu beer went on sale around 1890 (sources give slightly different dates). Ebisu Station, opened in 1906, took the brand's name, and the district followed.",
    "The brewery closed in 1988, and the Yebisu Garden Place complex opened on the site in 1994. Brand labels were removed in 1943 under wartime rules, and the brand was revived in 1971.",
    "Daikanyama's land belonged to the Asakura family, rice merchants turned landowners, who developed their forested holdings in stages. Hillside Terrace, by the architect Fumihiko Maki, was built in phases from the late 1960s to 1998, and the Asakura family house (1919) survives as an Important Cultural Property. The T-Site bookshop complex opened across the road around 2011."],
 c:["The Museum of Yebisu Beer tells the brand's history, with free entry and a small fee for the tasting tours.","Daikanyama is the quiet, design-minded neighbourhood next door, and Nakameguro follows the Meguro River, lined with cherry trees that are lit in spring."],
 f:["Ebisu is Tokyo's beer district, with izakaya, Ebisu Yokocho's tiny stalls, and craft beer bars; Nakameguro and Daikanyama add small cafés and natural wine bars."],
 s:[["Museum of Yebisu Beer","https://www.japan-experience.com/all-about-japan/tokyo/museums-galleries/museum-yebisu-beer"],["Nomunication: Ebisu drinking guide","https://www.nomunication.jp/ebisu-drinking-guide/"],["Wattention: Daikanyama","https://wattention.com/wtt31-shibuya-daikanyama/"],["Japan Property Central: Hillside Terrace","https://japanpropertycentral.com/daikanyama-hillside-terrace/"]]});

addLore("marunouchi",{
 h:["Marunouchi means 'inside the circle', for its place within the palace's outer moat. Before Tokugawa Ieyasu arrived in 1590 the site was an inlet of Tokyo Bay (Hibiya), filled in from 1592. Daimyo mansions followed, giving the area the nickname 'daimyo alley', and it is now Tokyo's financial district.",
    "Tokyo Station opened in December 1914 as the central terminus facing the Imperial Palace. The German Franz Baltzer's first design was rejected, and Tatsuno Kingo took over in 1903. The domes were lost in the 1945 air raids and rebuilt as simpler roofs, until a five-year restoration reopened the building on 1 October 2012. It was designated an Important Cultural Property in 2003."],
 c:["Marunouchi Naka-dori runs from the station towards the palace and is Tokyo's grandest avenue of offices and boutiques.","The old Tokyo Central Post Office next door was reborn as the KITTE shopping complex."],
 f:["Tokyo Station's own food streets, including Ramen Street on the Yaesu side, are among the easiest places to eat well in the city."],
 s:[["Wikipedia: Tokyo Station","https://en.wikipedia.org/wiki/Tokyo_Station"],["Wikipedia: Marunouchi","https://en.wikipedia.org/wiki/Marunouchi"],["Tokyo National Research Institute: Station restoration","https://www.tobunken.go.jp/materials/nenshi-en/1018111.html"]]});

addLore("ginza",{
 h:["Ginza means 'silver mint'. The Edo shogunate set up a silver-coin office here in 1612 (some sources say 1603, moved from Sunpu), the Ginza Yakusho, and the name stuck after the mint moved away.",
    "A fire in 1872 burned most of the district, and the Meiji government made it a showcase for modernisation, rebuilding it as a Western-style brick town. Sources credit the Irish engineer Thomas Waters with the designs, though others name the surveyor Colin McVean. Rents were high and the bricks poor, so little of the brick town survives."],
 c:["Wako and Mitsukoshi anchor the main crossing, and on Sundays Chuo-dori is closed to traffic. Kabuki-za, rebuilt several times since it opened in 1889, lets you watch a single act.","Ginza is also Tokyo's gallery district, with many small private galleries on the upper floors of ordinary buildings."],
 f:["The classic Ginza meal is a sushi counter or a tempura counter; the depachika food halls in the department-store basements are the casual version."],
 s:[["Wikipedia: Ginza","https://en.wikipedia.org/wiki/Ginza"],["Metropolis: Hidden Ginza","https://metropolisjapan.com/heartlands-hidden-ginza/"],["Japan Experience: Ginza","https://www.japan-experience.com/all-about-japan/tokyo/attractions-and-excursions/ginza"]]});

addLore("nihonbashi",{
 f:["Nihonbashi's fish market, Uogashi, fed Edo for centuries and was the largest in Japan by the mid-1800s, until the 1923 earthquake destroyed it and the trade moved to Tsukiji. Edo-style sushi grew out of that fish trade: nigiri began as street food in the early 1800s."],
 s:[["Unseen Japan: Edo-mae sushi","https://unseen-japan.com/edomae-sushi/"]]});

addLore("tsukiji",{
 c:["Tsukiji's lanes are packed with knife makers, kitchenware and tea sellers, a living trade directory for Japanese cooking. The temple Tsukiji Hongwanji, with its Indian-inspired stonework, stands at the edge of the market."],
 t:["Counts of shops range from about 400 to 500, and many stalls close by early afternoon."]});

addLore("nippori",{
 h:["The area was a wholesale textile district from the Taisho era to the end of the Showa era, selling cloth to dealers from the provinces. Retail shops gradually took over, and specialist stores now line the street."],
 c:["Nippori Chuo-dori runs about a kilometre from the station and sells fabric, leather, buttons, patterns and trims. Side alleys and upper floors ('Ura-Nippori' and 'Oku-Nippori') hide more shops. Tomato's five floors are the best known; Mihama and Tsukiyasu are named for Japanese fabrics, and Maki Ito for leather.",
    "Fashion students come here, and the town holds a fashion-design contest each autumn."],
 t:["Shop counts differ by source (about 80 to 90). Check opening days before you go: many shops close on Sundays."],
 s:[["Nippori Fabric Town: about","https://www.nippori-senigai.com/en/about/"],["GO TOKYO: Nippori","https://www.gotokyo.org/en/destinations/northern-tokyo/nippori/index.html"]]});

addLore("kuramae",{
 f:["Kuramae's small makers sit alongside cafés and bean-to-bar chocolate shops, so a craft browse here turns naturally into a coffee or chocolate break."],
 s:[["Tokyo by Food: Kuramae food guide","https://tokyobyfood.com/kuramae-food-guide/"]]});

addLore("skytree",{
 h:["Tokyo Skytree opened in May 2012 and, at 634 metres, is the tallest tower in the world; it is in Sumida ward, where the ukiyo-e master Hokusai lived most of his 90 years. The Sumida Hokusai Museum opened in 2016 to honour him. Ushijima Shrine, the oldest shrine in Sumida, dates from the Edo period."],
 c:["Sumida is the heart of Tokyo's craft industries: glass, chopsticks and bowls, knives and scissors. Edo kiriko cut glass can be tried at long-established workshops here; the glassmaker Hirota was founded in 1899."],
 f:["Tokyo Solamachi, the mall at the tower's foot, has a food floor with some of the city's best-loved kaitenzushi."],
 s:[["Visit Sumida guide (PDF)","https://visit-sumida.jp/uploads/2018/03/sumida2018_eng.pdf"],["Magical Trip: Ryogoku and Oshiage","https://magical-trip.com/media/ultimate-guide-to-ryogoku-oshiage-a-foreign-visitors-guide-to-tokyos-sumo-district"],["Wikipedia: Edo kiriko","https://en.wikipedia.org/wiki/Edo_kiriko"]]});

addLore("kiyosumi",{
 h:["The garden began as the site of an Edo-period villa, and Iwasaki Yataro, the founder of Mitsubishi, bought it in 1878 and made it a garden for entertaining guests and relaxing staff. He gathered large stones from across Japan to set around the central pond, which is fed by water from the Sumida River.",
    "The garden sheltered local people from the fires of the 1923 earthquake. Mitsubishi donated the eastern half to the city, which opened it to the public in 1932, and it is now a Place of Scenic Beauty."],
 c:["It is a circuit garden: you walk the pond's edge on the stepping stones, past a mound modelled on Mt Fuji and the 1909 teahouse that once hosted Lord Kitchener."],
 f:["Kiyosumi-Shirakawa was a working-class warehouse district before the roasters moved in, and coffee is now the draw: Blue Bottle and Allpress both have large stores here."],
 s:[["Tokyo Cheapo: Kiyosumi Garden","https://tokyocheapo.com/lifestyle/outdoors/kiyosumi-garden"],["Visiting Japan: Kiyosumi Gardens","https://www.visiting-japan.com/en/articles/tokyo/e13kt-kiyosumi-teien.htm"]]});

addLore("akihabara",{
 c:["Akihabara's maid cafés began with Cure Maid Café, which opened in March 2001. Fans of anime and games created a 2.5-dimensional social space between fiction and reality, and the cafés were an extension of that.",
    "Retro-game shops, such as Super Potato, are now as much of a draw as the electronics megastores."],
 s:[["Wikipedia: Maid cafe","https://en.wikipedia.org/wiki/Maid_cafe"],["Japan Travel: Akihabara","https://www.japan.travel/en/spot/2178/"],["Nippon.com: Japan Glances","https://www.nippon.com/en/features/jg00007/"]]});

addLore("kagurazaka",{
 c:["The alleys are named for how they behave: Kakurenbo Yokocho means 'hide-and-seek alley' for its tangle of turns, and the cobbled Hyogo Yokocho is a favourite filming location, lined with black wooden fences and ryotei hidden behind noren curtains.",
    "Counts differ by source. One puts the 1930s at about 150 ryotei and 600 geisha, and today at about 4 ryotei and 20 geisha; another gives 34 geisha and 9 ryotei in 2005."],
 f:["The French influence grew from the Institut Franco-Japonais, founded here in 1952. You can eat galettes and cider at Breton restaurants such as Le Bretagne, and matcha parfaits at Japanese tea cafés like Kagurazaka Saryo."],
 t:["Restaurants in Hyogo Yokocho are in high demand; reserve ahead."],
 s:[["Japan City Tour: Kagurazaka","https://japancitytour.com/kagurazaka/"],["GLT: Hyogo Yokocho","https://www.gltjp.com/en/directory/item/16313/"],["Omakase: Kagurazaka","https://omakaseje.com/articles/ma239562"]]});

addLore("jimbocho",{
 c:["Specialist shops cover philosophy, art, science and rare books, and publishers' offices cluster among them, which is why the district feels like a working book trade, not a museum."],
 s:[["Japan Experience: Jimbocho","https://www.japan-experience.com/all-about-japan/tokyo/attractions-excursions/jinbocho"]]});

addLore("koenji",{
 c:["Koenji's Awa Odori, borrowed from a Tokushima dance tradition, began in 1957 with only 38 dancers and now draws thousands over two days in late August.",
    "The PAL and Look shopping streets just south of the station are the vintage-clothing grid. The live-house scene survives in places like Niman Denatsu (the successor to 20000V) and Penguin House."],
 f:["North of the station, Nakadori Shotengai under the tracks is yakitori, karaoke boxes and subculture bars. In the daytime, street stalls sell croquettes, taiyaki and tofu doughnuts."],
 s:[["Experience Suginami: Koenji","https://experience-suginami.tokyo/?p=726"],["Nomado: Koenji","https://www.nomadotravel.app/en/attractions/koenji"]]});

addLore("kichijoji",{
 h:["Inokashira Park opened in 1917 and drew visitors and residents to Kichijoji. After the war an influx of artists, writers and entrepreneurs cemented it as a cultural hub.",
    "Harmonica Yokocho began as an open-air black market by the station (accounts differ on whether it started in 1944 or after the war). The name comes from its layout, a writer's comparison of the tiny packed shops to the reed chambers of a harmonica. In the 1960s the stalls turned into eating and drinking places, and a younger generation of owners revived it in the 1990s."],
 c:["The Ghibli Museum, supervised by Hayao Miyazaki, opened in 2001 on the western edge of the park, in Mitaka. Tickets are by reservation only."],
 f:["Around 100 tiny shops fill Harmonica Yokocho: cafés and boutiques by day, yakitori bars and izakaya by night."],
 s:[["JW Web Magazine: Kichijoji guide","https://jw-webmagazine.com/tips/kichijoji-guide/"],["Tokyo Metropolitan Government (PDF)","https://www.english.metro.tokyo.lg.jp/documents/d/english/aw2018_prbook_web_p19-20-pdf"],["Stripes: Kichijoji","https://www.stripes.com/travel/kichijoji-tokyo-neighborhood-is-popular-place-to-visit-1.98270"]]});

/* ===== NAKASENDO AND FUJI AREA ===== */
addLore("magome",{
 f:["Gohei mochi, grilled rice-cake skewers brushed with a sweet-savoury sauce, is the Kiso valley speciality; soba and grilled river fish are the usual meals."],
 c:["The valley is famous for hinoki cypress: wood from the Kiso valley was used to build Ise Jingu, one of Japan's most important shrines. Magome's souvenir shops sell mostly locally made goods in the village tradition, such as hats and straw sandals."],
 s:[["Wikivoyage: Magome","https://kwx.liehendr.com/content/wikivoyage_en_all_maxi_2025-02/A/Magome"],["Japan Travel: Narai-juku","https://en.japantravel.com/nagano/the-kiso-valley-s-narai-juku/6380"]]});

addLore("tsumago",{
 c:["The Waki-honjin Okuya, a former inn, gives a sense of how travellers stayed on the Nakasendo. Magome is more polished and restored, while Tsumago feels more rugged and authentic."],
 f:["There is a well-known gohei mochi shop in the south of town, and restaurants serving soba with grilled fish and Kiso ingredients."],
 s:[["Wikivoyage: Tsumago","https://en.wikivoyage.org/wiki/Tsumago"]]});

addLore("trail",{
 h:["The Nakasendo was the inland road between Edo and Kyoto, with 69 post towns; the Kiso valley stretch is the best known, and the roughly eight kilometres between Magome and Tsumago take two to three hours through forest and past waterfalls."],
 c:["Both post towns have preserved and restored their traditional architecture; the walk is mostly an old stone path through cedar forest, with tea houses on the way."],
 s:[["Wikipedia: Nakasendo","https://en.wikipedia.org/wiki/Nakasend%C5%8D"]]});

addLore("hakone",{
 h:["In 1619 the Tokugawa shogunate set up a checkpoint on the Tokaido road at Hakone to control traffic between Edo and Kyoto. It was designated a National Historical Property in 1922, and a replica completed in 2007 stands near Lake Ashi.",
    "Hot springs drew travellers through the Edo period, and Hakone revived as a summer and spa resort in the late 19th century."],
 c:["Yosegi-zaiku, the wood marquetry of Hatajuku, builds patterns from many woods compressed and then planed into thin sheets. Sources disagree on its origins, from the Warring States period to a late Edo craftsman, Ishikawa Nihei, around 1845 to 1848."],
 s:[["Tokyo Weekender: Hakone, a checkpoint in history","https://www.tokyoweekender.com/travel/hakone-a-checkpoint-in-history/"],["Hakone Yosegi-zaiku: history","https://hakone-japan.com/yosegizaiku/history/index.html"],["Samurai Archives: Hakone","https://samurai-archives.com/wiki/Hakone"]]});

addLore("kawaguchiko",{
 h:["The name 'Fuji Five Lakes' was coined in 1927 for a newspaper contest to choose Japan's finest scenery. Kawaguchi Asama Shrine, northeast of the lake, was founded to appease Mt Fuji after the Jogan eruption of 864, and a shrine to Benzaiten sits on Unoshima, the only island in the five lakes.",
    "Fuji worship, Fuji-ko, called for pilgrims to purify themselves in the lakes; Kawaguchiko and Yamanakako stayed places of that bathing pilgrimage. In 2013 the area was named a World Heritage site, 'Fujisan, Sacred Place and Source of Artistic Inspiration'."],
 c:["Cape Ubuyagasaki is a famous place to see 'upside-down Fuji', the mountain reflected in still water."],
 f:["The local dish is hoto, thick flat noodles simmered with vegetables in miso soup, a Yamanashi staple."],
 s:[["Wikipedia: Fuji Five Lakes","https://en.wikipedia.org/wiki/Fuji_Five_Lakes"],["MLIT: Fuji Five Lakes","https://www.mlit.go.jp/tagengo-db/en/R1-00131.html"],["Yamanashi tourism","https://www.yamanashi-kankou.jp/english/explore-by-area/fujisan-fujigoko/index.html"]]});

/* ===== KYOTO ===== */
addLore("pontocho",{
 h:["Pontocho began as a sandbar in the Kamo River that was reclaimed, with houses built from 1670, and teahouses were permitted from 1712. The name's origin is unsettled; one popular idea links it to a Portuguese word.",
    "A common claim that kabuki began here is popular legend, not established fact."],
 c:["Pontocho Kaburenjo Theater is the practice hall for geisha and maiko and stages the Kamogawa Odori, the spring dance performances. Sources disagree whether it runs in May only or in spring and autumn.",
    "Kawayuka, the open-air platforms built over the river from May to September, number almost a hundred and were designed to beat the summer heat."],
 s:[["Japan Travel: Pontocho","https://www.japan.travel/en/spot/79/"],["Samurai Archives: Pontocho","https://samurai-archives.com/wiki/Pontocho"],["Mai-ko: Pontocho","https://mai-ko.com/travel/japan/kyoto/pontocho-kyoto/"]]});

addLore("fushimi",{
 h:["Tradition dates Fushimi Inari to 711 and ties it to the Hata clan, immigrants from the Korean peninsula whose skills included irrigation, silk and sake brewing. In the founding myth, Hata no Irogu shot an arrow at a rice cake, which turned into a white bird and flew to the peak of Mt Inari, where rice grew.",
    "Inari is the kami of rice and, later, of commerce. The fox is its messenger, and the key in a fox's mouth is the granary key. It is the head shrine of about 30,000 Inari shrines across Japan; the main buildings burned in the Onin War and were rebuilt in 1499."],
 f:["Foxes are said to love fried tofu, which is why inari-zushi, rice wrapped in sweet fried tofu, takes the shrine's name."],
 s:[["Wikipedia: Fushimi Inari-taisha","https://en.wikipedia.org/wiki/Fushimi_Inari-taisha"],["Kyoto Travel: Fushimi Inari","https://kyoto.travel/en/shrine_temple/180.html"],["Ancient History Sites: Fushimi Inari","https://www.ancient-history-sites.com/?p=117144"]]});

addLore("arashiyama",{
 h:["Heian-period aristocrats escaped to Arashiyama's riverside for boating parties, a custom that let them leave the confines of the court for an afternoon. Tenryu-ji, the head temple of the Tenryu branch of Rinzai Zen, is ranked first among Kyoto's five great Zen temples."],
 c:["The Sogenchi garden, by Muso Soseki, is one of Kyoto's oldest landscape gardens and a famous example of borrowed scenery (shakkei)."],
 f:["Shigetsu, inside Tenryu-ji, serves shojin ryori, the vegetarian Buddhist cuisine that came to Japan from China with Zen in the 12th century. The meal centres on tofu simmered in a light kombu broth plus small seasonal dishes, and it is Bib Gourmand listed. Reserve at least three days ahead."],
 s:[["Fathom: Tenryu-ji and Shigetsu","https://www.fathomaway.com/tenryuji-shigetsu"],["Japan Experience: Tenryu-ji","https://www.japan-experience.com/all-about-japan/kyoto/temples-shrines/tenryuji-temple"],["Inside Kyoto: Shigetsu","https://insidekyoto.com/shigetsu-restaurant-arashiyama"]]});

addLore("kinkakuji",{
 h:["The site was first a villa of the Saionji family before Ashikaga Yoshimitsu acquired it in 1397. After his death it became a Zen temple (Rokuon-ji is its formal name). The villa hosted Ming envoys and an imperial visit in 1408, with entertainments including Noh and poetry contests."],
 c:["The refined taste of Yoshimitsu's era, mixing court elegance with Zen and samurai power, is often called Kitayama culture. The pond garden may be older than the pavilion, perhaps dating to the 13th century."],
 f:["Some of the sub-temples in nearby Daitoku-ji serve vegetarian shojin ryori."],
 s:[["Wikipedia: Kinkaku-ji","https://en.wikipedia.org/wiki/Kinkaku-ji"],["Japan Travel: History of Kinkaku-ji","https://vi.japantravel.com/kyoto/kyoto-kinkaku-ji-temple/10465"],["Kansai Odyssey: Ashikaga Yoshimitsu","https://kansai-odyssey.com/?p=4224"]]});

addLore("demachiyanagi",{
 h:["Shimogamo Shrine sits in the fork of the Kamo and Takano rivers, and records show it existed by 677; it was a Kamo-clan shrine and is a UNESCO World Heritage site (1994). Its surrounding forest, Tadasu no Mori, is the 'forest of truth', where lies are said to be unable to hide, so disputes were once settled there."],
 c:["Shimogamo is home to the Aoi Matsuri, one of Kyoto's three great festivals, with a procession in Heian court dress and yabusame horseback archery. The river junction next to it is where students sit on stepping stones."],
 f:["Day-to-day food around Kyoto University is cheap student cooking, bakeries and small cafés, a contrast with the tea-house cooking of the east side."],
 s:[["Japan Travel: Shimogamo Shrine","https://www.japan.travel/es/spot/1160/"],["Lonely Planet: Shimogamo-jinja","https://www.lonelyplanet.com/japan/kansai/kyoto/attractions/shimogamo-jinja/a/poi-sig/402760/356698"],["Green Shinto: Tadasu no Mori","https://www.greenshinto.com/tag/tadasu-no-mori/"]]});

addLore("kurama",{
 c:["The Kurama Fire Festival on 22 October at Yuki Shrine re-enacts the shrine's transfer from the imperial palace in the Heian period (sources give 940 or 970). Torches are lit outside every house, and two portable shrines are rushed down the steep stone steps. It was cancelled in 2018 after a typhoon, the first time in 30 years."],
 f:["From May to September Kibune's restaurants build kawadoko platforms over the stream; in November the meals move indoors."],
 t:["The two-car Eizan train from Demachiyanagi takes about 30 minutes. The festival is on 22 October, so a November visit misses its crowds."],
 s:[["Kyoto Travel: Yuki Shrine","https://kyoto.travel/en/destinations/yukijinja-shrine/"],["Japan Experience: Kurama Fire Festival","https://www.japan-experience.com/all-about-japan/kyoto/events-and-festivals/kurama-fire-festival"],["Kyoto Shimbun: festival cancelled 2018","https://e.kyoto-np.jp/news/20181007/3381.html"]]});

/* ===== OSAKA ===== */
addLore("dotonbori",{
 c:["The Five Playhouses (Naka-za and Kaku-za for kabuki, Takemoto-za and Toyotake-za as rival bunraku houses, and Benten-za, which began as a clockwork automata theatre) gave the canal its theatre-district identity. By 1662 one count lists six kabuki and five bunraku theatres and the Takeda Karakuri mechanical puppets."],
 s:[["MLIT: Dotonbori","https://www.mlit.go.jp/tagengo-db/en/R4-00636.html"]]});

addLore("shinsekai",{
 h:["The first Tsutenkaku tower of 1912 was modelled on the Eiffel Tower. It was scrapped during the war and rebuilt in 1956; the present tower is 103 metres tall, with an observatory at 91 metres. One account ties the district to the 1903 National Industrial Exposition, with the eastern side becoming Tennoji Park; accounts of the timeline differ."],
 c:["The neighbourhood has stayed largely untouched since the war, so its neon signs and hand-painted boards give it a vintage feel."],
 f:["Kushikatsu skewers here are cheap, about ¥150 each at the time of the sources; Daruma opened in 1929."],
 s:[["JW Web Magazine: Shinsekai guide","https://jw-webmagazine.com/tips/shinsekai-guide/"],["JRailPass: Shinsekai","https://www.jrailpass.com/blog/shinsekai-osaka"]]});

addLore("amemura",{
 c:["The district's character is streetwear, vintage clothing and music, with Triangle Park as its meeting point."],
 f:["Cafés and stall food here lean towards what young crowds want: crepes, bubble tea and takoyaki."]});

addLore("umeda",{
 h:["Umeda was farmland until the 1870s, when the prefecture reclaimed and filled the area to build the first Osaka Station (opened 1874). The name was once written with characters meaning 'buried field' and was later changed to 'plum field', probably to avoid the gloomy sense (the details are disputed). Hanshin Umeda opened in 1906, Hankyu Umeda in 1910 and the Midosuji subway line in 1933."],
 c:["The HEP Five building's Ferris wheel and the Hankyu terminal show how Osaka's private railways built their own shopping districts around their stations."],
 f:["Stand-up bars and kushikatsu counters cluster around Umeda's station arcades."],
 s:[["Wikipedia: Umeda","https://en.wikipedia.org/wiki/Umeda"],["JRPass: Guide to Umeda","https://www.jrpass.com/ja/blog/guide-to-umeda-explore-osaka-s-glamorous-side?c=CAD"]]});

addLore("osakacastle",{
 c:["Hideyoshi's Golden Tea Room was a portable gilded tea house used in 1586. A full-scale model is in the castle museum and a replica is at the MOA Museum of Art; the original is thought to have been lost when the castle fell. The gold on the keep is a replica too, as the 1931 reconstruction did not use real gold.",
    "The 1931 concrete keep was funded by Osaka's citizens and stands on the original foundations."],
 s:[["The Golden Tea Room (MOA Museum)","https://www.moaart.or.jp/en/?p=2434"],["Japan City Tour: Osaka Castle","https://japancitytour.com/osaka-castle/"]]});

/* ===== Remaining gaps ===== */
addLore("shimokita",{f:["Shimokitazawa is known for its curry restaurants, small izakaya and coffee shops tucked in and around the station, alongside the vintage shops."]});
addLore("nippori",{f:["Yanaka Ginza's croquettes and the old kissaten of Yanaka are a short walk away, so a fabric trip pairs naturally with a snack and a coffee there."]});
addLore("akihabara",{f:["Themed cafés are the signature here. For an ordinary meal, look for curry, ramen and gyudon counters near the station."]});
addLore("trail",{f:["Rest houses along the path offer walkers tea, and the two towns sell gohei mochi. Carry water and a snack, because there are no shops on the forest stretch."]});
addLore("hakone",{f:["Kuro-tamago, black eggs cooked in the sulphur springs, are the signature snack at Owakudani, and the onsen inns serve kaiseki dinners."]});
addLore("higashiyama",{f:["Along Sannenzaka and Ninenzaka, shops sell yatsuhashi (cinnamon rice sweets), pickles and matcha soft-serve, and tea houses serve wagashi sets."]});
addLore("gion",{f:["The ochaya are for invited guests, but you can eat kaiseki and obanzai at the restaurants along Hanamikoji and Shijo, and take matcha with wagashi at the tea rooms."]});
addLore("fushimi",{c:["The thousands of torii are donations from businesses and individuals, each inscribed with the donor's name and the date. The walk to the summit takes a few hours return, and the upper trails empty out quickly."]});
addLore("nakazaki",{f:["Small cafés and sweet shops in converted old houses are the draw here."]});
addLore("osakacastle",{f:["The castle park has picnic lawns and seasonal food stalls, and is a standard place for cherry-blossom picnics."]});

/* ===== Tokyo ===== */
addLore("shimokita",{
 h:["After the war the area became a small market hub for US soldiers, and in the 1970s and 80s alternative Tokyo youth moved out here to afford a creative lifestyle."],
 c:["Shimokita has one of the densest clusters of live-music venues in Tokyo outside the big hubs, with a focus on guitar-driven rock and indie bands. Shimokitazawa Three is a long-time cheap venue for up-and-coming acts.",
    "B&B is a bookstore with a beer bar, where you can browse books with a glass of local beer. New York Joe Exchange sells used clothing in a former public bathhouse."],
 f:["The area has no single speciality dish, but its independent coffee houses are the draw: Frankie recreates a Melbourne-style café and uses Allpress beans. Izakaya Ism is a much-loved local izakaya, and often has a wait."],
 t:["Venues and cafés change quickly here (the Culture Trip piece mentions a pop-up dining space that was due to close in 2019), so check before you go.","Shimokitazawa is about 7 minutes from Shinjuku on the Odakyu line and about 3 minutes from Shibuya on the Keio Inokashira line."],
 s:[["Culture Trip: Shimokitazawa guide","https://theculturetrip.com/asia/japan/articles/a-complete-neighbourhood-guide-to-shimokitazawa"],CT_TOKYO]});

addLore("ebisu",{
 c:["Nakameguro (Nakame) is built around the Meguro River, and the canal walk is beautiful in both the cherry-blossom (sakura) and autumn-leaf (koyo) seasons, which means a November visit catches the leaves. Its hipster reputation has been dented by new development, but it keeps much of its old-school charm.",
    "Daikanyama is technically a residential neighbourhood, known for small boutiques that favour up-and-coming designers and plenty of quiet cafés. Jiyugaoka, in the south of Meguro ward, is known for zakka shops (home and lifestyle goods) and La Vita, a small Venice-style canal with a gondola, about 10 minutes from Shibuya."],
 s:[CT_TOKYO,CT_UNDER]});

addLore("kagurazaka",{
 c:["Kagurazaka lies at the foot of the former Edo Castle. Along Waseda-dori, the main road, you may find few hints of its past, but the slim cobbled alleys on either side hold the old geisha-quarter atmosphere. Akagi Shrine, redesigned by Kengo Kuma, looks more like a contemporary gallery than a shrine."],
 s:[CT_TOKYO,CT_UNDER]});

addLore("jimbocho",{
 c:["Hundreds of used bookstores line Yasukuni-dori, and more than five major universities in the area make it an intellectual hub, with literary societies and publishing houses mixed in. It suits a quiet afternoon with a book and a coffee."],
 s:[CT_TOKYO]});

addLore("kichijoji",{
 c:["Kichijoji has a youthful, easy-going reputation, and on weekends you'll often hear live bands near the shops or people practising instruments in the park. Inokashira Park lies south of the station, with the main shopping district to the north."],
 s:[CT_TOKYO]});

addLore("yanesen",{
 h:["Yanaka, Nezu and Sendagi are shitamachi (downtown) areas, historically poor and lived in by lower-class residents, and they appeal today because they are among the few places left in Tokyo where visitors can see a little of the old city."],
 c:["The local cats are the neighbourhood's mascot. No one knows why so many strays settled here (one idea is the trees and temples), but locals grew so fond of them that they pushed for cats on the district flag.",
    "Seven cat statues were installed in 2008 around Yanaka Ginza for good luck, some on the rooftops of shops, and cat-themed desserts and souvenirs are sold along the street. The cats avoid crowds and gather on steps by the eastern entrance to Yanaka Ginza, and Yanaka Cemetery's wooded grounds are the best place to meet them. Feeding strays is discouraged.",
    "Dozens of mostly Buddhist temples are scattered around the area, and the district is home to artisanal craft stores and family-run businesses."],
 f:["Maneki-ya makes taiyaki, the fish-shaped bean-paste cakes, in the shape of the lucky maneki-neko cat, with other fillings such as beef stew and strawberry jelly with cream cheese."],
 s:[["Culture Trip: Tokyo's cat town","https://theculturetrip.com/asia/japan/articles/this-is-why-you-need-to-visit-tokyos-cat-town"],CT_UNDER]});

addLore("shibuya",{
 h:["Shibuya Station served over 2.4 million passengers a day at the time of the Culture Trip article, and about 2,500 people are thought to cross the scramble at once. It opened in 1885 on what became the JR Yamanote Line and is now shared by JR East, Keio, Tokyu and Tokyo Metro.",
    "Hachiko's story as Culture Trip tells it: the dog met Professor Ueno at the station each day, and after the professor died suddenly Hachiko kept returning for nine more years. When a former student reported it, the story spread. The statue was put up in 1934, and Hachiko died of cancer a year later at 11."],
 c:["The crossing is a favourite film backdrop: Lost in Translation (2003) and The Fast and the Furious: Tokyo Drift (2006) both used it.","The area has a reputation as the fashionable young people's district, home to the Shibuya 109 mall and several department stores around the station."],
 s:[["Culture Trip: A short history of Shibuya Crossing","https://theculturetrip.com/asia/japan/articles/tokyos-most-iconic-attraction-shibuya-crossing"]]});

WARDINFO["13110"].t+=" Jiyugaoka, in the south, is known for zakka (home and lifestyle goods) shops and La Vita, a small Venice-style canal.";
WARDINFO["13116"].t+=" Sugamo, nicknamed 'Harajuku for grannies', has Jizo-dori, a shopping street for retirees, and Koganji temple, where a statue of Togenuki Jizo is said to heal ailments.";
WARDINFO["13104"].t+=" Shin-Okubo is Tokyo's 'Little Korea', with the densest cluster of Korean restaurants, cafés and beauty shops, and Takadanobaba is the home of Astro Boy.";

/* ===== Kyoto ===== */
addLore("gion",{
 h:["Maiko and geiko emerged in Kyoto after the imperial court moved to Heian-kyo in 794."],
 c:["Walk Pontocho in the evening and you might hear the clip-clop of a geiko's geta sandals as she hurries to an appointment. Side streets hold traditional restaurants, bars and teahouses.",
    "Tea ceremony is deeply rooted in Zen, and Kyoto remains the spiritual home of both the ceremony and tea growing. The small teahouse En, near Chion-in, offers it."],
 s:[CT_KYOTO,CT_TRAD]});

addLore("higashiyama",{
 c:["Kiyomizu-dera is about a 20-minute walk from Yasaka Shrine in Gion, and the walk is part of the experience: narrow lanes lined with traditional wooden buildings and merchant shops selling local crafts and souvenirs.",
    "Yuzen dyeing, the technique behind the colourful designs of yuzen kimono, dates to the Genroku period (1688 to 1704), when the artist Miyazaki Yuzen developed it near Chion-in. A few shops in Kyoto still do it by hand."],
 s:[CT_KYOTO,CT_TRAD]});

addLore("nishijin",{
 h:["Kyoto's weaving district sits in the north-west of central Kyoto, and the current style of kimono, which opens at the front and is tied with an obi sash, developed in Kyoto in the Edo period (1603 to 1868)."],
 c:["Nishijin is the source of kimono fabric and obi, with machiya townhouses and well-preserved streets. HOSOO, a textile company and showroom founded in 1688, still works here, and the Nishijin Textile Center offers a free kimono show and shopping."],
 f:["There are also small cafés in the old machiya, a good place to rest between workshops."],
 s:[CT_KYOTO,CT_TRAD,["Kyoto Prefecture: traditional crafts","https://www.pref.kyoto.jp/en/01-02-01.html"]]});

addLore("arashiyama",{
 c:["Culture Trip's summary: walk through the bamboo grove, eat a traditional Zen Buddhist meal, and meet the cheeky local monkeys."],
 s:[CT_KYOTO]});

addLore("fushimi",{
 c:["Thousands of vermilion gates form tunnels along several paths that snake up the forested mountain to the summit, and Culture Trip calls it one of the most impressive sights in all of Japan."],
 s:[CT_KYOTO]});

/* ===== Osaka ===== */
addLore("dotonbori",{
 c:["Namba, the wider entertainment district, is where bunraku and kabuki are still regularly performed, and Hozenji Yokocho, a quiet, mystical backstreet, sits a few minutes from the canal.","Shinsaibashi, just north, is the main shopping district: high-end boutiques, 100-yen shops, and tax-free shopping in the big Shinsaibashisuji arcade."],
 s:[CT_OSAKA]});

addLore("amemura",{
 c:["Amemura is a small, eclectic haven for Osaka's counterculture, where skateboarders, Lolita fashion and American paraphernalia (a Statue of Liberty replica, cowboy hats) live together. The nightlife includes a video-game bar called Space Station, a 'nocturnal apothecary' called Nayuta and the nightclub Circus."],
 s:[CT_OSAKA]});

addLore("horie",{
 h:["Horie grew into Osaka's boutique-and-café neighbourhood just west of Amerikamura."],
 c:["It is a patchwork of independent boutiques, galleries and authentic foreign restaurants where local artistic types and expats gather: botanical shop Biotop and the coffee-and-bicycle shop Giracha are named examples."],
 f:["Expect international food and independent coffee; Saboten, a Mexican restaurant, is known for Taco Tuesday."],
 s:[CT_OSAKA]});

addLore("tenma",{
 h:["Tenma is one of Osaka's older districts, centred on the Osaka Tenmangu shrine."],
 c:["By day it has ancient shrines and the longest shopping street in Japan, and by night lanterns light the lanes."],
 f:["The evening draw is the standing bars and local pubs, among the best in the city."],
 s:[CT_OSAKA]});

addLore("nakazaki",{
 h:["Nakazakicho began to become a hipster hangout in 2001, when Jun Amanto opened Salon de AManTO as an artist refuge in a derelict district. He turned a 120-year-old building into half café, half community centre, recycling every bit of the old building, and has since worked with other artists to renovate more buildings."],
 c:["The district is full of tiny independent galleries. Gallery Yolcha, a vine-covered wooden building down a dirt path, has hidden nooks and levels reached by ladder; Irorimura and AIDA Gallery are better known. Green Pepe is a vintage shop specialising in 1960s and 70s items."],
 f:["Taiyo no Tou is a colourful café with antiques and fruit-and-veg-heavy menus, and Granda Familio roasts its own granola. Nakazakicho is one of the few places in Osaka where vegan, vegetarian and organic food is easy to find."],
 s:[["Culture Trip: Things to do in Nakazakicho","https://theculturetrip.com/asia/japan/osaka/articles/the-best-things-to-do-in-nakazakicho"],CT_OSAKA]});

addLore("umeda",{
 c:["Umeda is the northern hub where most of Osaka's train lines meet, with commuters by day and shopping, dining and nightlife around them."],
 s:[CT_OSAKA]});

addLore("shinsekai",{
 c:["Culture Trip says Shinsekai's faded neon reflects a heyday shortly after the war, though it had an earlier life as home to a grand amusement park and what was then Asia's tallest structure. Spa World, the giant bath complex, is also here."],
 s:[CT_OSAKA]});

addLore("osakacastle",{
 c:["Morinomiya, the area around the castle, is a thriving commercial and residential district, and the castle sits inside a large park where you could spend a whole day."],
 s:[CT_OSAKA]});

var H_OLD=["Harding: The Old Badger","https://www.chrishardingjapan.com/p/the-old-badger"];

/* ===== Place notes ===== */
addLore("marunouchi",{
 h:["The area's story starts with Ieyasu. When Tokugawa Ieyasu took over the Kanto region in 1590, Edo was a small castle town beside a swamp, and the castle itself was a near-derelict mess. He built it up quietly, won the battle of Sekigahara in 1600 and became shogun in 1603. A century later Edo was, some say, the largest city in the world.",
    "After landing near Tokyo on 30 August 1945, General MacArthur first set up in the Imperial Hotel, opposite the Imperial Palace. The administration under his command was known as GHQ, and the Occupation set out to demilitarise Japan, break up the big zaibatsu firms and democratise it."],
 s:[H_OLD,H_OCC1]});

addLore("nihonbashi",{
 f:["Edo residents woke to the cries of nattō sellers, and the sticky fermented soybeans were eaten in soup, with chopped vegetables and tofu, and eventually on rice with soy sauce and mustard, the version known today. A nattō seller appears in an illustrated Edo encyclopaedia from 1690."],
 s:[H_NATTO]});

addLore("skytree",{
 c:["Hokusai's Great Wave, from his Thirty-Six Views of Mount Fuji (1831), was a hit in Edo, though when it was made it would have cost about as much as a bowl of noodles. A copy sold at Sotheby's Hong Kong for about $2.8 million late in 2025. He used an imported pigment, Prussian blue, and 'serious' artists looked down on him as a tradesman; a story, probably apocryphal, has him beating a respected painter in a contest before the shogun with a single blue curve and a chicken with vermilion-painted feet.",
    "How you read it depends on how you read text. Read left to right, as in English, the eye travels with the wave, as if surfing it. Read right to left, as in Japanese, you move into the wave, and the drama shifts to the people in the boats while Mt Fuji looks on."],
 s:[H_WAVE]});

addLore("osakacastle",{
 h:["Hideyoshi was born in 1537 into a peasant family, rose as a sandal-carrier and general under Oda Nobunaga, and took over after Nobunaga died in 1582, avenging him on the traitor Akechi Mitsuhide. He commissioned Noh plays about his own achievements, starred in them, and made Japan.s elite sit and watch.",
    "He launched two invasions of Korea in the 1590s, the first in 1592 with around 150,000 men, the largest seaborne deployment of troops to another country in history up to then. He died on 18 September 1598, leaving a death poem that calls even Osaka Castle a dream within a dream."],
 s:[H_SUN,H_OLD]});

addLore("kinkakuji",{
 c:["Ryoan-ji's garden has fifteen stones set in raked white sand, placed so that from any viewpoint only fourteen are visible. People have asked why for about 500 years. One reading is that the stones are islands of consciousness in a larger emptiness, and that no single point of view can take in everything. Visitors sit on the veranda of the main hall to look.",
    "The garden belongs to the time when high-ranking samurai, keen to shed their image as men of violence, took up painting, calligraphy and Noh alongside Zen priests who had Chinese connections. Their gardens, often in the karesansui ('dry landscape') style, used raked sand or gravel to suggest water and favoured contemplation over parties."],
 s:[H_GARD2]});

/* ===== City-level threads ===== */
THEMES.tokyo.push(
 {t:"Edo began as a leaky castle by a swamp",d:"When Tokugawa Ieyasu was given the Kanto region in 1590, Edo was a small town by a swamp with a near-derelict castle. He built it up patiently while Hideyoshi's Korean wars drained his rivals, won at Sekigahara in 1600 and became shogun in 1603. A century later Edo was, some say, the largest city on Earth, and the Tokugawa ruled for 264 years.",s:H_OLD},
 {t:"The Occupation left marks all over the city",d:"Tokyo from the air in 1945 was a city burned out by firebombing. MacArthur set up in the Imperial Hotel opposite the palace, and the Occupation imposed a constitution that made the Emperor a symbol and renounced war. Sony began in a leaky shack, running a truck on black-market petrol taken from US Army stores, and made Japan's first transistor radio in 1955; its name came from 'sonus' and the GI word 'sonny'. Tezuka Osamu's Astro Boy first appeared in spring 1952.",s:H_OCC1},
 {t:"What public life feels like",d:"Harding argues the tidy streets and considerate crowds visitors notice come from how children are raised: omotenashi, anticipating others' needs, and 'group living' at school, where pupils clean their own classrooms and learn to ask 'kashite' (may I borrow it) and answer 'dozo'. Public behaviour is held to a high standard while home is where people relax, so expect quiet trains and few things going wrong.",s:H_TRUST},
 {t:"Nattō and Edo mornings",d:"People have probably eaten nattō since the 8th or 9th century, but the sticky kind we know is documented from the early 1400s. Edo residents woke to nattō sellers calling their wares, and the combination of soy sauce, mustard and rice settled in that era.",s:H_NATTO}
);
THEMES.kyoto.push(
 {t:"How to read a Japanese garden",d:"Heian aristocrats' gardens were built around a pond fed by two streams, with a waterfall made of rocks gathered on a hill. The 11th-century Sakuteiki, probably the oldest gardening book in the world, tells the gardener to arrange the water by Chinese geomancy: the blue dragon of the east, the white tiger of the west, the black tortoise of the north and the vermilion bird of the south. Rocks should be found, not cut, and used the way they lay in nature, or they become 'cursed'. Gardeners aimed for charismatic imperfection, off-centre and staggered placement ('geese in flight'), and suggestion rather than showing everything. Late Heian 'paradise gardens' added lotus and strange plants to evoke the Pure Land. Later, samurai and Zen priests brought the karesansui garden, raked sand for water, built for contemplation, and tsubo-niwa courtyard gardens still appear in cafés and hotels.",s:H_GARD1},
 {t:"Cherry blossoms and impermanence",d:"The blossom moves people because it joins two ideas: Shinto's celebration of new life and Buddhism's focus on impermanence. The feeling that holds them together is mono no aware, being moved by the passing of all things. Mass blossom-viewing parties became a seasonal event in the Edo era. A November visit will miss the blossom but can catch the autumn leaves, which carry the same meaning.",s:H_GARD2}
);
THEMES.nakasendo.push(
 {t:"Nattō at the ryokan breakfast",d:"Many first-time visitors meet nattō, fermented soybeans, on the breakfast tray of a ryokan or minshuku. There are two kinds: a salty, dry temple version from China, and the sticky 'string-drawing' kind, the one you are likely to meet. A popular legend ties it to the warrior Minamoto no Yoshiie, and the usual advice is to stir it hard, often quoted as 424 times, before eating.",s:H_NATTO}
);

var H_YAMA=["Walking the Yamanote Line (guest post by Gianni Simone)","https://www.chrishardingjapan.com/archive"];
var H_OCC2=["Harding: The Allied Occupation II, The Gangster","https://www.chrishardingjapan.com/p/the-gangster"];
var H_NOBU=["Harding: Why Oda Nobunaga Welcomed the West","https://www.chrishardingjapan.com/p/why-oda-nobunaga-welcomed-the-west"];
var H_GHOST=["Harding: Does Japan Believe in Ghosts?","https://www.chrishardingjapan.com/p/does-japan-believe-in-ghosts"];
var H_NARA=["Harding: Shaken Down by Deer, Inspired by a Buddha","https://www.chrishardingjapan.com/p/shaken-down-by-deer-inspired-by-a"];

THEMES.tokyo.push(
 {t:"Tokyo is a mosaic, not one city",d:"A walk round the Yamanote loop, which was completed in 1925, shows how different the neighbourhoods are: parklike cemeteries at Yanaka, Sugamo and Zoshigaya, Showa-era streets near Otsuka, pan-Asian enclaves around Ikebukuro and Shin-Okubo, Okachimachi's jewellery quarter, restaurants tucked under the tracks at Yurakucho, and a river walk from Osaki along the Meguro River to the old Tokaido at Shinagawa. In Yanaka and Nezu you can hear shamisen practice and temple bells, and Benten-do in Ueno Park has its own stalls. Pick a station, not a 'Tokyo'.",s:H_YAMA},
 {t:"Sugamo Prison and the shadow side of the Occupation",d:"Class-A war-crimes suspects were held at Sugamo in Tokyo. Tojo Hideki was hanged there on 23 December 1948, and the next day Kishi Nobusuke (grandfather of Abe Shinzo) was released without trial. The fixer Kodama Yoshio, who had made a fortune in wartime China, was freed the same day and helped fund the party that became the LDP in 1955. It explains why postwar Japanese politics grew out of the Occupation's 'reverse course' as much as its reforms.",s:H_OCC2},
 {t:"Reverence and play at temples",d:"Harding's point on belief: Japan treats gods and spirits as a disposition, a feeling and a practice, not a statement of creed. Most visitors to Senso-ji could not recite Buddhism's Eightfold Path, but they know the mixture of reverence and fun involved in a visit. Shinto and Buddhism share sites, devotees and sometimes deities, so you needn't choose a side to join in. Obon, in summer, is when the dead are welcomed back with dancing; Tokyo Halloween is kept entirely separate.",s:H_GHOST},
 {t:"Fruit sandwiches and milk bread",d:"Japan's soft white shokupan bread and the fruit sandwich both belong to a western-style food culture that took off in Tokyo and Osaka: fruit parlours (Sembikiya is the famous one, with roots in the Tokugawa era) and station sandwiches, which date back to the 1890s ekiben. Good for a cafe stop between neighbourhoods.",s:["Harding: Sugar Rush","https://www.chrishardingjapan.com/archive"]}
);
THEMES.osaka.push(
 {t:"Okonomiyaki is postwar food",d:"The savoury pancake as people know it took shape in the shortages after the war, when cheap flour and cabbage were the answer. Osaka's wartime scientists and cooks had already been designing emergency diets. Osaka and Hiroshima still argue about whose version is right, and the answer is to try both.",s:["Harding: Conflict Cuisine","https://www.chrishardingjapan.com/archive"]}
);
THEMES.kyoto.push(
 {t:"Honno-ji, Nobunaga and Mount Hiei",d:"Oda Nobunaga marched into Kyoto in 1568 and made both Emperor and shogun puppets. He welcomed the Portuguese and their guns, but was merciless to the armed Buddhist sects: in 1571 his troops burned Mount Hiei, just outside the city, and Honno-ji in Kyoto is where his own general turned on him in 1582 and he died as the temple burned. The Jesuit Luis Frois lived a street away and wrote it down.",s:H_NOBU},
 {t:"Nara, the first permanent capital",d:"An hour south of Kyoto, Nara was the capital from 710 to 784, laid out on a Chinese grid with stone foundations. After smallpox killed around a third of Japan's population, Emperor Shomu built Todai-ji with a Great Buddha of the cosmic Buddha Vairocana, whose eyes were painted at the 752 ceremony by an Indian monk, Bodhisena. The deer in the park are treated as messengers of the gods and will nudge you for crackers.",s:H_NARA}
);

function ringArea(r){var a=0;for(var i=0;i<r.length;i++){var p=r[i],q=r[(i+1)%r.length];a+=p[0]*q[1]-q[0]*p[1]}return a/2}
function centroid(r){var a=0,x=0,y=0;for(var i=0;i<r.length;i++){var p=r[i],q=r[(i+1)%r.length],f=p[0]*q[1]-q[0]*p[1];a+=f;x+=(p[0]+q[0])*f;y+=(p[1]+q[1])*f}a*=.5;return [y/(6*a),x/(6*a)]}
function inRing(lng,lat,r){var c=false;for(var i=0,j=r.length-1;i<r.length;j=i++){var xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c}return c}

/* ---------- prepare city data ---------- */
function prep(key){
  var c=CITIES[key];if(c.ready)return c;c.ready=true;
  c.hoodBy={};c.hoods.forEach(function(h){c.hoodBy[h.id]=h;h.ward=null});
  c.W=[];c.wardBy={};
  var merged={};
  (c.wards||[]).forEach(function(f){
    var m=merged[f.c];if(!m){m=merged[f.c]={c:f.c,en:f.en,p:[]}}
    m.p=m.p.concat(f.p);
  });
  Object.keys(merged).map(function(k){return merged[k]}).filter(function(f){return f.p.length}).forEach(function(f){
    var w={code:f.c,en:f.en,ja:JA[f.c]||"",f:f,hoods:[],places:[],info:WARDINFO[f.c]||null};
    w.polys=f.p.map(function(poly){return poly.map(function(ring){return ring.map(function(pt){return [pt[1],pt[0]]})})});
    var best=null,ba=0;f.p.forEach(function(poly){var a=Math.abs(ringArea(poly[0]));if(a>ba){ba=a;best=poly[0]}});
    w.label=centroid(best);
    c.W.push(w);c.wardBy[f.c]=w;
  });
  c.hoods.forEach(function(h){
    for(var i=0;i<c.W.length;i++){
      var w=c.W[i],hit=false;
      for(var k=0;k<w.f.p.length;k++){if(inRing(h.lng,h.lat,w.f.p[k][0])){hit=true;break}}
      if(hit){h.ward=w;w.hoods.push(h);break}
    }
  });
  c.places.forEach(function(p){p.hoodObj=c.hoodBy[p.hood]||null;var w=p.hoodObj&&p.hoodObj.ward;if(w)w.places.push(p)});
  return c;
}

function firstSentence(s,max){
  s=String(s||"");var m=s.match(/^.*?[.!?](\s|$)/);var t=m?m[0].trim():s;
  if(t.length>max)t=t.slice(0,max-1).replace(/\s+\S*$/,"")+"…";return t;
}
function wardTip(w){
  var h="<b>"+w.en+"</b>"+(w.ja?" <span class='tj'>"+w.ja+"</span>":"");
  if(w.info){h+="<div class='tt'>"+w.info.tag+"</div>"}

  if(w.hoods.length)h+="<div class='tf'>"+w.hoods.length+" area"+(w.hoods.length>1?"s":"")+": "+w.hoods.slice(0,4).map(function(x){return x.short}).join(", ")+(w.hoods.length>4?"…":"")+"</div>";
  return h+"<div class='tc'>Click for the full summary</div>";
}
function hoodTip(h){
  var lo=(typeof LORE!=="undefined"&&LORE[h.id])||{};

  h2+="<div class='tf'>"+(h.tags||[]).map(function(t){return TAGS[t]||t}).join(" · ")+"</div>";
  return h2+"<div class='tc'>Click for history, food and craft</div>";
}
function chaikin(p,n){while(n--){var o=[p[0]];for(var i=0;i<p.length-1;i++){var a=p[i],b=p[i+1];o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}o.push(p[p.length-1]);p=o}return p}
function buildLayers(){
  var c=prep(state.city);
  Object.keys(G).forEach(function(k){if(k!=="line")G[k].clearLayers()});
  map.removeLayer(G.line);
  c.W.forEach(function(w){
    var has=w.hoods.length;
    w.layer=L.polygon(w.polys,{className:"ward w"+(parseInt(w.code,10)%5)+(has?" has":""),interactive:true}).addTo(G.ward);
    w.layer.bindTooltip(wardTip(w),{sticky:true,className:"wtip wardtip",direction:"auto",offset:[18,0]});
    w.layer.on("click",function(){selectWard(w.code)});
    L.marker(w.label,{interactive:false,keyboard:false,icon:L.divIcon({className:"wlabel"+(w.hoods.length?" main":""),html:"<span>"+w.en+"</span>",iconSize:[0,0]})}).addTo(G.ward);
  });
  c.hoods.forEach(function(h){
    h.circle=L.circle([h.lat,h.lng],{radius:(h.r||.5)*1000,className:"hood c"+washIdx(h.name)}).addTo(G.hood);
    h.circle.bindTooltip(hoodTip(h),{sticky:true,className:"wtip hoodtip",direction:"auto",offset:[18,0]});
    h.circle.on("click",function(){selectHood(h.id)});
    L.marker([h.llat||h.lat,h.llng||h.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:"hlabel"+(h.lalign?" ha-"+h.lalign:""),html:"<span>"+h.short+(h.ltag?"<em>"+h.ltag+"</em>":"")+"</span>",iconSize:[0,0]})}).addTo(G.hood);
  });
  if(state.city==="nakasendo"&&typeof NK_TRAIL!=="undefined"){
    var tr=L.polyline(chaikin(NK_TRAIL,3),{color:"#1e2527",weight:1.2,opacity:.9,lineCap:"round",lineJoin:"round",className:"trail"}).addTo(G.hood);
    tr.bindTooltip("Magome to Tsumago, the old Nakasendo trail",{sticky:true,className:"wtip",direction:"auto",offset:[14,0]});
    tr.on("click",function(){selectHood("trail")});
    L.circleMarker(NK_TRAIL[0],{radius:4,color:"#1e2527",weight:1,fillColor:"#fff",fillOpacity:1,interactive:false,className:"trail-end"}).addTo(G.hood);
    L.circleMarker(NK_TRAIL[NK_TRAIL.length-1],{radius:4,color:"#1e2527",weight:1,fillColor:"#1e2527",fillOpacity:1,interactive:false,className:"trail-end"}).addTo(G.hood);
  }
  c.places.forEach(function(p){
    var mine=p.src==="research"||p.src==="list";
    p.mine=mine;
    p.m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"pin pinb pin-"+p.cat+(mine?" mine":""),html:ico(p.cat,true),iconSize:[28,28],iconAnchor:[14,14]}),riseOnHover:true,keyboard:false});
    p.m.bindTooltip(p.name,{permanent:true,direction:"right",offset:[16,0],className:"pintip"});
    p.m.on("click",function(){selectPlace(p)});
  });
  refreshPins();
  if(c.hotel){
    var m=L.marker([c.hotel.lat,c.hotel.lng],{icon:L.divIcon({className:"pinb hotelb",html:ico("hotel",true),iconSize:[32,32],iconAnchor:[16,16]}),keyboard:false}).addTo(G.hotel);
    m.bindTooltip(c.hotel.name,{permanent:true,direction:"right",offset:[18,0],className:"hoteltip"});
    m.on("click",function(){if(c.hotel.hood)selectHood(c.hotel.hood)});
  }
  if(state.city==="tokyo"){buildLines();if(state.lines)G.line.addTo(map)}
}

function pinVisible(p){return state.cats[p.cat]&&(!state.mine||p.mine)}
function refreshPins(){
  C().places.forEach(function(p){
    var on=G.pin.hasLayer(p.m),want=pinVisible(p);
    if(want&&!on)G.pin.addLayer(p.m);else if(!want&&on)G.pin.removeLayer(p.m);
  });
  applySel();
}

function applySel(){
  var c=C();
  c.W.forEach(function(w){var e=w.layer&&w.layer.getElement();if(e)e.classList.toggle("sel",state.ward===w.code&&!state.hood)});
  c.hoods.forEach(function(h){var e=h.circle&&h.circle.getElement();if(e)e.classList.toggle("sel",state.hood===h.id)});
  c.places.forEach(function(p){
    var e=p.m&&p.m.getElement();if(e)e.classList.toggle("sel",state.place===p);
    var t=p.m&&p.m.getTooltip&&p.m.getTooltip();var te=t&&t.getElement&&t.getElement();if(te)te.classList.toggle("on",state.place===p);
  });
}

/* ---------- selection ---------- */
function selectWard(code){
  var w=C().wardBy[code];if(!w)return;
  state.ward=code;state.hood=null;state.place=null;
  map.flyToBounds(w.layer.getBounds(),{paddingTopLeft:[40,40],paddingBottomRight:[innerWidth>900?150:40,40],maxZoom:13.5,duration:.7});
  applySel();render();
}
function selectHood(id){
  var h=C().hoodBy[id];if(!h)return;
  state.hood=id;state.ward=h.ward?h.ward.code:null;state.place=null;
  var pt=map.latLngToContainerPoint([h.lat,h.lng]),sz=map.getSize();
  var inView=map.getZoom()>=12.5&&pt.x>40&&pt.x<sz.x-(innerWidth>900?130:40)&&pt.y>40&&pt.y<sz.y-40;
  if(!inView)map.flyTo([h.lat,h.lng],(h.r||.5)>=.8?15:15.5,{duration:.8});
  applySel();render();
}
function selectPlace(p){
  state.place=p;state.hood=p.hood;var h=p.hoodObj;state.ward=h&&h.ward?h.ward.code:null;
  map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),16),{duration:.6});
  applySel();render();
}
function goCity(){state.ward=null;state.hood=null;state.place=null;map.flyToBounds(C().bounds,{duration:.7});applySel();render()}
function goWard(){state.hood=null;state.place=null;var w=C().wardBy[state.ward];if(w){selectWard(w.code)}else goCity()}
function goHood(){var id=state.hood;state.place=null;selectHood(id)}

/* ---------- panel ---------- */
function catName(id){return CATN[id]||id}
function tagsHTML(a){return "<div class='tags'>"+(a||[]).map(function(t){return "<span class='tag'>"+(TAGS[t]||t)+"</span>"}).join("")+"</div>"}
function lis(a){return "<ul class='dots'>"+a.map(function(s){return "<li>"+s+"</li>"}).join("")+"</ul>"}
function gq(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function badge(id){var l=LINE[id];return l?"<span class='lb' style='--c:"+l.c+"' title='"+l.name+" line'>"+id+"</span>":""}
function placeRow(p){return "<li><button class='row' data-place='"+C().places.indexOf(p)+"'>"+ico(p.cat)+"<span class='nm'>"+p.name+(p.mine?" <span class='cnt'>yours</span>":"")+"</span><span class='sub'>"+p.note+"</span></button></li>"}
function hoodRow(h){var n=C().places.filter(function(p){return p.hood===h.id}).length;
  return "<li><button class='row wide' data-hood='"+h.id+"'><span class='nm'>"+h.name+" <span class='cnt'>"+h.jp+(n?" · "+n+" place"+(n>1?"s":""):"")+"</span></span><span class='sub'>"+h.tag+"</span></button></li>"}
function crumbs(parts){
  var out=["<button data-nav='city'>"+C().short+"</button>"];
  var w=state.ward&&C().wardBy[state.ward],h=state.hood&&C().hoodBy[state.hood];
  if(parts>=1&&w)out.push(parts>1||h?"<button data-nav='ward'>"+w.en+"</button>":"<span>"+w.en+"</span>");
  if(parts>=2&&h)out.push(parts>2?"<button data-nav='hood'>"+h.name+"</button>":"<span>"+h.name+"</span>");
  if(parts>=3&&state.place)out.push("<span>"+state.place.name+"</span>");
  return "<nav class='crumbs'>"+out.join(" › ")+"</nav>";
}

var WASH=[["#bfe3d3","#bfe0e6","#f6d5c0"],["#f3c9d2","#c9e4de","#e9e3b8"],["#bfe0e6","#d9d2ef","#f3c9d2"],["#cfe6da","#f7d9c4","#bfe0e6"],["#f6d5c0","#f3c9d2","#cfe6da"]];
function washIdx(en){var hv=0;for(var i=0;i<en.length;i++)hv=(hv*31+en.charCodeAt(i))%997;return hv%WASH.length}
var HOODCOL=["#bfe3d3","#f3c9d2","#bfe0e6","#d9d2ef","#f6d5c0"];
function nearHoods(hd,n){
  var c=C();return c.hoods.filter(function(x){return x!==hd}).sort(function(a,b){
    function d(p){return Math.pow(p.lat-hd.lat,2)+Math.pow(p.lng-hd.lng,2)}return d(a)-d(b)}).slice(0,n);
}
/* the sheet's circles are the map's neighbourhood circles: same colour, relative size and name */
var lastDiscs="";
function discsHTML(list,act){
  var pos=[[40,-8,170],[6,58,124],[92,116,78],[168,30,66],[150,128,52]];
  return list.slice(0,5).map(function(h,i){
    var p=pos[i],d=Math.round(p[2]*(.78+Math.min(h.r||.5,1.1)*.2));
    return "<button class='sun s"+i+(act===h.id?" on":"")+"' data-hood='"+h.id+"' aria-label='"+h.name+"' style='right:"+p[0]+"px;top:"+p[1]+"px;width:"+d+"px;height:"+d+"px;background:"+HOODCOL[washIdx(h.name)]+"'></button>"}).join("");
}
function hero(ja,en,sub,list,act){
  var n=Math.max(ja.length,1),fs=Math.max(24,Math.min(58,Math.floor(224/n))),rs=en.length>16?1.7:en.length>11?2.1:2.7;
  return (function(){var k=(list||[]).map(function(x){return x.id}).join(),still=k===lastDiscs;lastDiscs=k;return "<div class='hero"+(act?" pick":"")+(still?" still":"")+"'>"+(list&&list.length?discsHTML(list,act):"")})()+"<div class='ttl'><div class='brush' style='font-size:"+fs+"px'>"+ja+"</div></div><div class='cap'><div class='sub'>"+sub+"</div><div class='rom' style='font-size:"+rs+"rem'>"+en+"</div></div></div>";
}
function dsc(n){return "<span class='dsc' style='--c:"+(CATCOL[n]||"#1e2527")+"'>"+ico(n)+"</span>"}
function paras(a){return a.map(function(s){return "<p class='para'>"+s+"</p>"}).join("")}
function srcs(a){return "<p class='srcs'>Sources: "+a.map(function(s){return "<a target='_blank' rel='noopener' href='"+s[1]+"'>"+s[0]+"</a>"}).join(" · ")+"</p>"}
function themesHTML(){
  var t=THEMES[state.city];if(!t)return "";
  return "<h4>Threads running through "+C().label+"</h4>"+t.map(function(x){
    return "<details class='theme'><summary>"+x.t+"</summary><p class='para'>"+x.d+"</p><p class='srcs'>Source: <a target='_blank' rel='noopener' href='"+x.s[1]+"'>"+x.s[0]+"</a></p></details>"}).join("");
}
function readingHTML(){
  if(typeof READING==="undefined")return "";
  return "<h4>"+ico("history")+"Go deeper</h4><ul class='dots'>"+READING.map(function(r){return "<li><a target='_blank' rel='noopener' href='"+r.u+"'>"+r.t+"</a></li>"}).join("")+"</ul>";
}
function cityHTML(){
  var c=C(),h=hero(c.ja,c.label,c.dates||"city guide",c.hoods.slice().sort(function(a,b){return (b.r||.5)-(a.r||.5)}))+"<p class='ptag'>"+c.tag+"</p><p class='lead'>"+c.intro+"</p>";
  h+="<div class='legend'>"+ico('mine')+"Yours</span><span>"+ico('sight')+"Sights</span><span>"+ico('eat')+"Eat</span><span>"+ico('make')+"Shops &amp; craft</span><span>"+ico('green')+"Parks</span></div>";
  var ws=c.W.filter(function(w){return w.hoods.length}).sort(function(a,b){return b.hoods.length-a.hoods.length||a.en.localeCompare(b.en)});

    h+="<h4>Wards on the route</h4><ul class='list'>"+ws.map(function(w){
      return "<li><button class='row wide' data-ward='"+w.code+"'><span class='nm'>"+w.en+" <span class='cnt'>"+w.ja+(w.hoods.length?" · "+w.hoods.length+" area"+(w.hoods.length>1?"s":""):"")+"</span></span><span class='sub'>"+(w.info?w.info.tag:"")+"</span></button></li>"}).join("")+"</ul>";
  }
  h+=themesHTML();

function wardHTML(){

function hoodHTML(){
  var c=C(),hd=c.hoodBy[state.hood];
  var h=crumbs(2)+hero(hd.jp,hd.name,"neighbourhood"+(hd.ward?" · "+hd.ward.en.toLowerCase():""),(hd.ward&&hd.ward.hoods.length>1?hd.ward.hoods.slice().sort(function(a,b){return (b.r||.5)-(a.r||.5)}):[hd].concat(nearHoods(hd,2))),hd.id);

  if(lo.f)h+="<h4>"+ico("eat")+"Food</h4>"+paras(lo.f);
  if(hd.eat&&hd.eat.length)h+="<h4>"+ico("eat")+"Eat &amp; drink</h4>"+lis(hd.eat);
  if(hd.picks)h+="<h4>"+ico("tips")+"Worth doing</h4><p style='margin:0'>"+hd.picks+"</p>";
  if(lo.t)h+="<h4>"+ico("tips")+"Good to know</h4>"+lis(lo.t);
  if(hd.yours&&hd.yours.length)h+="<div class='yours'><h4>From your research</h4>"+lis(hd.yours)+"</div>";

  if(lo.s)h+=srcs(lo.s);
  return h;
}
function placeHTML(){
  var c=C(),p=state.place,hd=p.hoodObj;
  var h=crumbs(3)+"<p class='eyebrow'>"+catName(p.cat)+"</p><h2 class='ptitle'>"+p.name+"</h2>";
  h+="<div style='margin:.5rem 0 .2rem'>";

  else h+="<span class='badge guide'>Suggested landmark</span>";
  h+="</div><p class='lead'>"+p.note+"</p>";
  if(hd)h+="<dl class='facts'><div><dt>Neighbourhood</dt><dd><button class='crumbbtn' data-hood='"+hd.id+"' style='border:none;background:none;padding:0;color:var(--ai);font-weight:700;text-decoration:underline'>"+hd.name+"</button></dd></div></dl>";
  h+="<div class='actions'><a class='btn' target='_blank' rel='noopener' href='"+gq(p.q)+"'>Open in Google Maps</a>";
  h+="<a class='btn ghost' target='_blank' rel='noopener' href='https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lng+"'>Directions</a>";
  if(c.hotel)h+="<a class='btn ghost' target='_blank' rel='noopener' href='https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(c.hotel.name)+"&destination="+p.lat+","+p.lng+"&travelmode=transit'>From the hotel</a>";
  h+="</div>";
  return h;
}
function render(){
  var el=$("#panel");
  el.innerHTML="<div class='pwrap'>"+(state.place?placeHTML():state.hood?hoodHTML():state.ward?wardHTML():cityHTML())+"</div>";
  el.scrollTop=0;
  plateTitle();
}
function plateTitle(){
  var c=C(),w=state.ward&&c.wardBy[state.ward],h=state.hood&&c.hoodBy[state.hood],p=state.place;
  var ja=h?h.jp:w?w.ja:c.ja,n=ORDER.indexOf(state.city)+1;

}
function hoodGlow(id,on){var h=C().hoodBy[id],e=h&&h.circle&&h.circle.getElement&&h.circle.getElement();if(e)e.classList.toggle("glow",on)}
$("#panel").addEventListener("mouseover",function(e){var b=e.target.closest(".sun");if(b)hoodGlow(b.dataset.hood,true)});
$("#panel").addEventListener("mouseout",function(e){var b=e.target.closest(".sun");if(b)hoodGlow(b.dataset.hood,false)});
$("#panel").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var c=C();
  if(b.dataset.nav==="city")return goCity();
  if(b.dataset.nav==="ward")return goWard();
  if(b.dataset.nav==="hood")return goHood();
  if(b.dataset.ward)return selectWard(b.dataset.ward);
  if(b.dataset.hood)return selectHood(b.dataset.hood);
  if(b.dataset.place)return selectPlace(c.places[+b.dataset.place]);
  if(b.dataset.zoom){var hd=c.hoodBy[state.hood];map.flyTo([hd.lat,hd.lng],(hd.r||.5)>=.8?15:15.5,{duration:.6})}
});

/* ---------- toolbar & tabs ---------- */
function buildTools(){
  var t=$("#maptools");
  var h="<div class='seg' role='group' aria-label='Base map'><button data-base='auto' aria-pressed='"+(state.base==="auto")+"'>Auto</button><button data-base='clean' aria-pressed='"+(state.base==="clean")+"'>Clean</button><button data-base='streets' aria-pressed='"+(state.base==="streets")+"'>Streets</button></div>";
  CATS.forEach(function(k){h+="<button class='chip' data-cat='"+k.id+"' aria-pressed='"+!!state.cats[k.id]+"'>"+dsc(k.id)+k.name+"</button>"});
  h+="<button class='chip' data-mine='1' aria-pressed='"+state.mine+"'>"+ico('mine')+"Only mine</button>";
  if(state.city==="tokyo")h+="<button class='chip line-chip' data-lines='1' aria-pressed='"+state.lines+"'>"+ico('line')+"Metro lines</button>";
  t.innerHTML=h;
}
$("#maptools").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.base){
    state.base=b.dataset.base;
    if(state.base==="auto")band();else useTiles(state.base);
  }else if(b.dataset.cat){state.cats[b.dataset.cat]=state.cats[b.dataset.cat]?0:1;refreshPins();render()}
  else if(b.dataset.mine){state.mine=!state.mine;refreshPins();render()}
  else if(b.dataset.lines){state.lines=!state.lines;if(state.lines)G.line.addTo(map);else map.removeLayer(G.line)}
  buildTools();
});
function buildTabs(){
  $("#tabs").innerHTML=ORDER.map(function(k){var c=CITIES[k];return "<button class='tab' role='tab' data-city='"+k+"' aria-selected='"+(k===state.city)+"' aria-label='"+c.label+"'><i>"+c.ja+"</i><span>"+c.short+"</span></button>"}).join("");
}
$("#tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setCity(b.dataset.city)});

var fitted=false,touched=false;
function fitCity(){var s=map.getSize();if(s.x>80&&s.y>80){map.fitBounds(C().bounds,{animate:false,paddingBottomRight:[innerWidth>900?112:0,0]});band();fitted=true}}
["pointerdown","wheel","keydown"].forEach(function(ev){$("#map").addEventListener(ev,function(){touched=true},{passive:true})});
function setCity(k){
  state.city=k;state.ward=null;state.hood=null;state.place=null;touched=false;
  prep(k);buildTabs();buildTools();buildLayers();
  map.invalidateSize();fitted=false;fitCity();
  band();applySel();render();
}
function refit(){map.invalidateSize();if(!fitted||(!touched&&!state.ward&&!state.hood&&!state.place))fitCity()}
if(window.ResizeObserver){new ResizeObserver(refit).observe($("#map"))}
window.addEventListener("load",refit);
window.addEventListener("resize",function(){map.invalidateSize()});
function loadGoogle(){
  if(!USE_GOOGLE||!GOOGLE_KEY||!L.gridLayer||!L.gridLayer.googleMutant)return;
  window.__gmReady=function(){
    try{
      var g=L.gridLayer.googleMutant({type:"roadmap",maxZoom:20});
      var old=tiles.streets;tiles.streets=g;
      if(curTile==="streets"){map.removeLayer(old);g.addTo(map);g.bringToBack()}
    }catch(e){}
  };
  var s=document.createElement("script");
  s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(GOOGLE_KEY)+"&language=en&region=JP&callback=__gmReady";
  s.async=true;document.head.appendChild(s);
}
loadGoogle();
setCity("tokyo");
})();

</script>
</body>
</html>
